<style>
/* Layout: una libreta de yardas de bolsillo. Encabezado del hoyo arriba, distancia grande, score de cada jugador abajo, pestañas fijas al pie. */
:root {
  --bg: #F3F5EF;
  --surface: #FFFFFF;
  --ink: #17251B;
  --muted: #5E6B60;
  --line: #D7DDD2;
  --fairway: #1F6B3A;
  --fairway-ink: #FFFFFF;
  --flag: #E2B529;
  --flag-ink: #1E1A08;
  --sand: #EDE3C8;
  --good: #1F7A45;
  --bad: #B3402C;
  --grid: #E6EAE2;
  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1712; --surface: #17221B; --ink: #E7EEE6; --muted: #9AA99C; --line: #2A3A2F;
    --fairway: #3E9E62; --fairway-ink: #08130C; --flag: #EFC646; --flag-ink: #1E1A08; --sand: #3A3524;
    --good: #5CC489; --bad: #E77A63; --grid: #223027;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1712; --surface: #17221B; --ink: #E7EEE6; --muted: #9AA99C; --line: #2A3A2F;
  --fairway: #3E9E62; --fairway-ink: #08130C; --flag: #EFC646; --flag-ink: #1E1A08; --sand: #3A3524;
  --good: #5CC489; --bad: #E77A63; --grid: #223027;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(84px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-num); font-weight: 700; font-size: 28px; letter-spacing: .02em; }
h2 { font-family: var(--font-num); font-weight: 600; font-size: 22px; letter-spacing: .02em; }
p { margin: 0; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
button, select, input { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
button.primary { background: var(--fairway); color: var(--fairway-ink); border-color: var(--fairway); }
button.flag { background: var(--flag); color: var(--flag-ink); border-color: var(--flag); }
button.ghost { background: transparent; }
button.link { border: 0; background: transparent; padding: 4px 6px; color: var(--fairway); text-decoration: underline; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
input, select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; min-width: 0; }
.panel > .field, .pitem > .field, .chosen > .field { flex: none; }

/* Encabezado del hoyo */
.hole-head { background: var(--fairway); color: var(--fairway-ink); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.hole-head .big { font-family: var(--font-num); font-size: 44px; line-height: 1; font-weight: 700; }
.hole-head .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
.hole-head button { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--fairway-ink) 40%, transparent); padding: 8px 12px; font-size: 20px; line-height: 1; }
.hole-mid { text-align: center; min-width: 0; }

/* Distancia */
.dist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.dist .cell { display: flex; flex-direction: column; gap: 2px; }
.dist .val { font-family: var(--font-num); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.dist .cell.main .val { font-size: 56px; color: var(--fairway); }
.gps-status { font-size: 13px; display: flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--good); }
.dot.off { background: var(--bad); }
#map { height: 260px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--sand); }

/* Jugadores en el hoyo */
.players { display: flex; flex-direction: column; }
.phead, .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.phead { padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.phead .label { text-align: center; }
.prow { padding: 8px 0; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.pname { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; border: 0; background: transparent; padding: 4px 6px; border-radius: 8px; text-align: left; }
.pname .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pname[aria-pressed="true"] { background: color-mix(in srgb, var(--fairway) 14%, transparent); }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 38px; height: 40px; padding: 0; font-size: 22px; line-height: 1; }
.stepper .v { font-family: var(--font-num); font-size: 28px; font-weight: 700; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; flex: 1; background: transparent; }
.seg button[aria-pressed="true"] { background: var(--fairway); color: var(--fairway-ink); }

/* Tiros */
.shots { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.shots li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.shots li:last-child { border-bottom: 0; }
.shot-n { font-family: var(--font-num); font-weight: 700; color: var(--muted); }

/* Tarjeta */
.card-scroll { overflow-x: auto; }
table.score { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; min-width: 340px; }
table.score th, table.score td { border: 1px solid var(--line); padding: 5px 4px; text-align: center; font-family: var(--font-num); font-size: 17px; }
table.score th { font-size: 12px; color: var(--muted); font-family: var(--font-body); font-weight: 600; letter-spacing: .03em; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.score td.cur { outline: 2px solid var(--flag); outline-offset: -2px; }
.birdie { color: var(--good); font-weight: 700; }
.bogey { color: var(--bad); }

/* Estadísticas */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--font-num); font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sand); color: var(--ink); white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--muted); }
.chart .endlabel { font-family: var(--font-num); font-size: 15px; font-weight: 700; fill: var(--ink); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:hover + .pt, .chart .pt.active { r: 6; }
.tip { font-size: 13px; min-height: 1.4em; }
.clubs { display: flex; flex-direction: column; gap: 8px; }
.club { display: grid; grid-template-columns: 76px minmax(0, 1fr) 58px; gap: 8px; align-items: center; }
.club .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.club .track { height: 14px; background: var(--grid); border-radius: 0 4px 4px 0; position: relative; }
.club .bar { height: 100%; background: var(--fairway); border-radius: 0 4px 4px 0; }
.club .yd { font-family: var(--font-num); font-size: 20px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.club .sub { grid-column: 2 / 4; font-size: 12px; color: var(--muted); margin-top: -6px; }

.round-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";

  /* ================= Utilidades ================= */
  const M_TO_YD = 1.09361;
  const MAX_PLAYERS = 5;
  const CLUBS = ["Driver", "Madera 3", "Madera 5", "Híbrido", "Hierro 4", "Hierro 5", "Hierro 6", "Hierro 7", "Hierro 8", "Hierro 9", "PW", "GW", "SW", "LW", "Putter"];
  const MAPLIBRE_JS = "https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js";
  const SAT_TILES = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
  const DEM_TILES = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
  const TRACE_COLORS = { Amarillo: "#FFD23F", Rojo: "#FF3B30", Blanco: "#FFFFFF", Celeste: "#4FC3F7" };
  const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter"];
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  const yd = (m) => Math.round(m * M_TO_YD);
  const fmtDate = (iso) => new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" });
  const fmtShort = (iso) => new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "short" });
  const signed = (n) => (n > 0 ? "+" + n : n === 0 ? "E" : String(n));
  const parseNum = (v) => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? null : n; };

  // Distancia entre dos puntos GPS (Haversine), en metros
  function distanceM(a, b) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  // Proyección local en metros alrededor de un origen (suficiente para distancias de una cancha)
  function toXY(origin, p) {
    const k = Math.PI / 180 * 6371000;
    return { x: (p.lng - origin.lng) * k * Math.cos(origin.lat * Math.PI / 180), y: (p.lat - origin.lat) * k };
  }
  function bearingDeg(a, b) {
    const r = Math.PI / 180, dL = (b.lng - a.lng) * r;
    const y = Math.sin(dL) * Math.cos(b.lat * r);
    const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos(dL);
    return (Math.atan2(y, x) / r + 360) % 360;
  }
  function circlePoly(c, radiusM, n = 28) {
    return Array.from({ length: n + 1 }, (_, k) => {
      const a = (k % n) / n * 2 * Math.PI;
      return { lat: c.lat + (radiusM * Math.cos(a)) / 111195, lng: c.lng + (radiusM * Math.sin(a)) / (111195 * Math.cos(c.lat * Math.PI / 180)) };
    });
  }
  function pointInPoly(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a.lat > pt.lat) !== (b.lat > pt.lat) && pt.lng < (b.lng - a.lng) * (pt.lat - a.lat) / (b.lat - a.lat) + a.lng) inside = !inside;
    }
    return inside;
  }
  function centroid(poly) {
    const f = poly[0], l = poly[poly.length - 1];
    if (poly.length > 3 && f.lat === l.lat && f.lng === l.lng) poly = poly.slice(0, -1);
    const s = poly.reduce((t, p) => ({ lat: t.lat + p.lat, lng: t.lng + p.lng }), { lat: 0, lng: 0 });
    return { lat: s.lat / poly.length, lng: s.lng / poly.length };
  }
  // Distancia al borde más cercano (frente) y al punto más lejano (fondo) del contorno del green
  function polyFrontBack(pos, poly) {
    if (pointInPoly(pos, poly)) return { front: 0, back: Math.max(...poly.map((p) => distanceM(pos, p))) };
    let front = Infinity;
    for (let i = 0; i < poly.length; i++) {
      const a = toXY(pos, poly[i]), b = toXY(pos, poly[(i + 1) % poly.length]);
      const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
      const t = L ? Math.max(0, Math.min(1, -(a.x * dx + a.y * dy) / L)) : 0;
      front = Math.min(front, Math.hypot(a.x + t * dx, a.y + t * dy));
    }
    return { front, back: Math.max(...poly.map((p) => distanceM(pos, p))) };
  }

  /* ================= Datos (guardados en este navegador) ================= */
  const KEY = "libreta-golf-v1";
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { /* sin almacenamiento */ }
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state.data)); } catch (e) { /* ignorar */ } }

  const EX_PARS = [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 3, 4, 5, 4, 4, 3, 4, 5];
  function exampleData() {
    const course = { id: "ej-cancha", name: "Cancha de ejemplo", pars: EX_PARS, rating: 71.2, slope: 125, greens: {}, greenPolys: {}, holeLines: {}, source: "manual", example: true };
    const mk = (daysAgo, scores, putts) => ({
      id: uid(), courseId: course.id, date: new Date(Date.now() - daysAgo * 864e5).toISOString(), done: true, example: true,
      players: [{ id: "me", name: "Vos", handicap: 18, isMe: true,
        holes: EX_PARS.map((p, i) => ({ strokes: scores[i], putts: putts[i], penalties: 0, fairway: p > 3 ? (i % 3 !== 0) : null, shots: [] })) }],
    });
    return {
      version: 2,
      profile: { name: "", handicap: 18, level: "intermedio" },
      courses: [course],
      rounds: [
        mk(35, [5, 6, 4, 6, 5, 5, 4, 5, 6, 5, 4, 6, 6, 5, 5, 4, 5, 7], [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 3]),
        mk(21, [5, 5, 4, 6, 5, 4, 3, 5, 6, 5, 4, 5, 6, 5, 4, 4, 5, 6], [2, 2, 2, 2, 2, 1, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]),
        mk(10, [5, 4, 3, 6, 5, 5, 4, 5, 5, 4, 4, 5, 6, 5, 5, 3, 5, 6], [2, 2, 1, 2, 2, 2, 2, 2, 2, 1, 2, 2, 2, 2, 2, 1, 2, 2]),
        mk(3, [4, 5, 3, 5, 5, 4, 4, 4, 6, 5, 3, 5, 5, 4, 5, 4, 4, 6], [2, 2, 2, 1, 2, 2, 2, 1, 2, 2, 1, 2, 2, 2, 2, 2, 2, 2]),
      ],
      activeRoundId: null,
    };
  }
  // Tiros de ejemplo, para que la distancia por palo tenga algo que mostrar
  function addExampleShots(round) {
    const plan = { 3: ["Hierro 7"], 4: ["Driver", "Hierro 8"], 5: ["Driver", "Madera 3", "PW"] };
    const base = { Driver: 212, "Madera 3": 192, "Hierro 7": 138, "Hierro 8": 128, PW: 102 };
    let seed = round.date.length + new Date(round.date).getDate();
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    round.players[0].holes.forEach((h, i) => {
      if (h.shots.length) return;
      let p = { lat: -34.47 + i * 0.004, lng: -58.52 };
      (plan[EX_PARS[i]] || []).concat(["Putter"]).forEach((club) => {
        h.shots.push({ lat: p.lat, lng: p.lng, club, t: 0 });
        const m = ((base[club] || 0) + (rnd() - 0.5) * 24) / M_TO_YD;
        p = { lat: p.lat + m / 111195, lng: p.lng };
      });
    });
  }
  // Pasa los datos de la versión anterior (un solo jugador) al formato nuevo
  function migrate(d) {
    d.version = 2;
    d.courses.forEach((c) => { c.greens = c.greens || {}; c.greenPolys = c.greenPolys || {}; c.holeLines = c.holeLines || {}; c.source = c.source || "manual"; });
    d.rounds.forEach((r) => {
      if (!r.players) {
        r.players = [{ id: "me", name: "Vos", handicap: d.profile.handicap, isMe: true, holes: r.holes || [] }];
        delete r.holes;
      }
      if (r.example) addExampleShots(r);
    });
    return d;
  }

  const state = {
    data: migrate(load() || exampleData()),
    tab: "ronda",
    hole: 0,
    sel: 0,                // jugador seleccionado en el hoyo
    pos: null, gps: "idle",
    club: "Driver",
    setGreenMode: false,
    showNewCourse: false,
    guests: [],            // jugadores invitados para la próxima ronda
    cat: { items: [], status: "idle", filter: "", showAll: false, busyKey: null, msg: "", locating: false },
    catPos: null,
    changingCourse: false,
    lastFinished: null,
    view: "main",          // "main" o "tracer" (video del tiro)
    tracer: null,
  };
  state.data.prefs = state.data.prefs || { mapMode: "2d", traceColor: "Amarillo" };
  save();

  const activeRound = () => state.data.rounds.find((r) => r.id === state.data.activeRoundId) || null;
  const courseOf = (round) => state.data.courses.find((c) => c.id === round.courseId);
  const meOf = (round) => round.players.find((p) => p.isMe) || round.players[0];

  /* ================= GPS ================= */
  let watchId = null;
  function startGps() {
    if (watchId !== null) return;
    if (!("geolocation" in navigator)) { state.gps = "unavailable"; return; }
    try {
      watchId = navigator.geolocation.watchPosition(
        (p) => { state.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }; state.gps = "on"; updateLive(); },
        (err) => { state.gps = err && err.code === 1 ? "denied" : "unavailable"; updateLive(); },
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
      );
    } catch (e) { state.gps = "unavailable"; }
  }
  function getPositionOnce() {
    return new Promise((resolve, reject) => {
      if (state.pos) return resolve(state.pos);
      if (!("geolocation" in navigator)) return reject(new Error("sin gps"));
      navigator.geolocation.getCurrentPosition((p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }), reject, { enableHighAccuracy: false, timeout: 15000 });
    });
  }

  /* ================= Canchas desde OpenStreetMap ================= */
  async function overpass(query) {
    let lastErr;
    for (const url of OVERPASS) {
      try {
        const res = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(query), headers: { "Content-Type": "application/x-www-form-urlencoded" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }
  /* Catálogo: todas las canchas de Argentina en OpenStreetMap, guardado en el celular por 30 días */
  const CAT_KEY = "libreta-golf-catalogo-v1";
  const norm = (x) => String(x || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  function readCatalog() { try { return JSON.parse(localStorage.getItem(CAT_KEY) || "null"); } catch (e) { return null; } }
  async function loadCatalog(force) {
    const cat = state.cat;
    // 1) Canchas precargadas junto a la app (las actualiza GitHub cada semana)
    try {
      const r = await fetch("canchas-ar.json", { cache: "no-cache" });
      if (r.ok) {
        const j = await r.json();
        state.bundle = new Map(j.canchas.map((c) => [c.k, c]));
        cat.items = j.canchas.map((c) => ({ key: c.k, type: c.k.split("/")[0], id: parseInt(c.k.split("/")[1], 10), name: c.n, place: c.c, lat: c.la, lon: c.lo, holes: c.h.length, par: c.h.length >= 9 && c.h.every((h) => h.p >= 3 && h.p <= 6) ? c.h.reduce((t, h) => t + h.p, 0) : null }));
        cat.status = "ok"; renderCourseList(); return;
      }
    } catch (e) { /* sin archivo: se usa el servicio de mapas */ }
    const cached = readCatalog();
    if (!force && cached && cached.items && cached.items.length && Date.now() - cached.ts < 30 * 864e5) {
      cat.items = cached.items; cat.status = "ok"; renderCourseList(); return;
    }
    cat.status = "loading"; renderCourseList();
    try {
      const q = `[out:json][timeout:90];area["ISO3166-1"="AR"][admin_level=2]->.a;nwr["leisure"="golf_course"]["name"](area.a);out tags center;way["golf"="hole"](area.a);out center;`;
      const data = await overpass(q);
      const courses = [], holes = [];
      data.elements.forEach((e) => {
        const c = e.center || (e.lat ? { lat: e.lat, lon: e.lon } : null);
        if (!c || !e.tags) return;
        if (e.tags.leisure === "golf_course") courses.push({ key: e.type + "/" + e.id, type: e.type, id: e.id, name: e.tags.name,
          place: e.tags["addr:city"] || e.tags["is_in:city"] || e.tags["addr:state"] || "", lat: c.lat, lon: c.lon, refs: {} });
        else if (e.tags.golf === "hole") holes.push({ lat: c.lat, lng: c.lon, ref: e.tags.ref || e.id });
      });
      // Cada hoyo se asigna a la cancha más cercana (hasta 2 km)
      holes.forEach((h) => {
        let best = null, bd = 2000;
        courses.forEach((c) => { const d = distanceM(h, { lat: c.lat, lng: c.lon }); if (d < bd) { bd = d; best = c; } });
        if (best) best.refs[h.ref] = 1;
      });
      cat.items = courses.map((c) => ({ key: c.key, type: c.type, id: c.id, name: c.name, place: c.place, lat: c.lat, lon: c.lon, holes: Object.keys(c.refs).length }));
      cat.status = "ok";
      try { localStorage.setItem(CAT_KEY, JSON.stringify({ ts: Date.now(), items: cat.items })); } catch (e) { /* sin espacio */ }
    } catch (e) {
      cat.status = cached && cached.items ? "ok" : "error";
      if (cached && cached.items) cat.items = cached.items;
    }
    renderCourseList();
  }
  function locateForCatalog() {
    if (state.catPos || state.cat.locating) return;
    state.cat.locating = true;
    getPositionOnce().then((p) => { state.catPos = p; }).catch(() => {}).finally(() => { state.cat.locating = false; renderCourseList(); });
  }
  function courseFromBundle(b) {
    const hs = b.h.slice().sort((x, y) => x.r - y.r);
    const P = (arr) => arr.map((q) => ({ lat: q[0], lng: q[1] }));
    const c = { id: uid(), name: b.n, pars: hs.map((h) => h.p || 4), rating: null, slope: null, greens: {}, greenPolys: {}, holeLines: {}, source: "osm", osm: b.k, center: { lat: b.la, lng: b.lo } };
    if (hs.some((h) => !h.p)) c.parsGuessed = true;
    hs.forEach((h, i) => {
      c.holeLines[i] = P(h.l);
      if (h.g) c.greenPolys[i] = P(h.g);
      c.greens[i] = h.f ? { lat: h.f[0], lng: h.f[1] } : h.g ? centroid(P(h.g)) : P(h.l)[h.l.length - 1];
    });
    return c;
  }
  async function pickCatalogCourse(item) {
    const cat = state.cat;
    const saved = state.data.courses.find((c) => c.osm === item.key);
    if (saved) { selectCourse(saved.id); return; }
    cat.busyKey = item.key; cat.msg = `Cargando ${item.name}…`; renderCourseList();
    try {
      let course = null;
      if (state.bundle && state.bundle.has(item.key)) course = courseFromBundle(state.bundle.get(item.key));
      else {
        const r = { type: item.type, id: item.id, name: item.name, center: { lat: item.lat, lon: item.lon } };
        const sel = r.type === "node" ? `node(${r.id});` : `${r.type}(${r.id});map_to_area->.c;`;
        const inArea = r.type === "node" ? `(around:1500,${r.center.lat},${r.center.lon})` : "(area.c)";
        const q = `[out:json][timeout:40];${sel}(way["golf"="hole"]${inArea};way["golf"="green"]${inArea};relation["golf"="green"]${inArea};node["golf"="pin"]${inArea};);out geom;`;
        course = buildCourse(r, (await overpass(q)).elements);
      }
      if (!course) course = { id: uid(), name: item.name, pars: [], rating: null, slope: null, greens: {}, greenPolys: {}, holeLines: {}, source: "osm", osm: item.key };
      course.center = course.center || { lat: item.lat, lng: item.lon };
      // Tarjeta: la oficial del club o la compartida por otros golfistas
      const off = findOfficial(await loadOfficialCards(), course);
      if (off) applyCard(course, { ...off, source: "club" });

      cat.busyKey = null;
      if (!course.pars.length) {
        cat.msg = `${item.name} todavía no tiene hoyos en el mapa ni tarjeta cargada. Cargá los pares de la tarjeta acá abajo; los greens los marcás tocando el mapa la primera vez que la juegues.`;

  /* ================= Tarjetas: par, handicap y yardas de cada hoyo ================= */
  // Datos del proyecto de Supabase para compartir tarjetas entre usuarios (la clave "anon" es pública por diseño)
  const SUPA = { url: "https://irvsqrxprjosmvbjxuie.supabase.co", key: "sb_publishable_QeuNgiYRd0Q3zG9hF_DFTw_5IPtsUkJ" };
  const courseKey = (c) => c.osm || "nombre:" + norm(c.name).replace(/\s+/g, " ").trim();
  let officialCards = null;
  async function loadOfficialCards() {
    if (officialCards) return officialCards;
    try { const r = await fetch("tarjetas.json", { cache: "no-cache" }); officialCards = r.ok ? await r.json() : {}; } catch (e) { officialCards = {}; }
    return officialCards;
  }
  function findOfficial(cards, c) {
    const k = cards[courseKey(c)] || cards["nombre:" + norm(c.name).replace(/\s+/g, " ").trim()];
    return k && validCard(k) ? k : null;
  }
  function validCard(card) {
    return card && Array.isArray(card.pars) && card.pars.length >= 9 && card.pars.length <= 18 && card.pars.every((p) => p >= 3 && p <= 6);
  }
  const supaHeaders = (extra = {}) => ({ apikey: SUPA.key, ...(SUPA.key.startsWith("eyJ") ? { Authorization: "Bearer " + SUPA.key } : {}), ...extra });
  const supaOn = () => !!(SUPA.url && SUPA.key);
  async function fetchShared(c) {
    if (!supaOn()) return null;
    try {
      const r = await fetch(`${SUPA.url}/rest/v1/tarjetas?course_key=eq.${encodeURIComponent(courseKey(c))}&select=card,created_at&order=created_at.desc&limit=1`, { headers: supaHeaders() });
      if (!r.ok) return null;
      const j = await r.json();
      return j[0] && validCard(j[0].card) ? { ...j[0].card, source: "usuarios", updated: j[0].created_at } : null;
    } catch (e) { return null; }
  }
  async function shareCard(c, card) {
    if (!supaOn()) return "off";
    try {
      const r = await fetch(`${SUPA.url}/rest/v1/tarjetas`, { method: "POST", headers: supaHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
        body: JSON.stringify({ course_key: courseKey(c), course_name: c.name, card: { pars: card.pars, hcp: card.hcp, tees: card.tees } }) });
      return r.ok ? "ok" : "error";
    } catch (e) { return "error"; }
  }
  function applyCard(c, card) {
    const n = card.pars.length;
    c.pars = card.pars.slice();
    ["holeLines", "greenPolys", "greens"].forEach((k) => Object.keys(c[k] || {}).forEach((i) => { if (+i >= n) delete c[k][i]; }));
    c.card = { pars: card.pars.slice(), hcp: (card.hcp || []).slice(0, n), tees: (card.tees || []).map((t) => ({ name: t.name || "", color: t.color || "", rating: t.rating ?? null, slope: t.slope ?? null, yards: (t.yards || []).slice(0, n) })),
      source: card.source || "vos", updated: card.updated || new Date().toISOString(), url: card.url || "" };
    const t0 = c.card.tees[0];
    if (t0) { c.rating = t0.rating ?? c.rating; c.slope = t0.slope ?? c.slope; }
    delete c.parsGuessed;
  }
  // Busca tarjeta nueva para una cancha guardada: la tuya > la oficial del club > la compartida
  async function refreshCard(c) {
    if (c.card && c.card.source === "vos") return false;
    const off = findOfficial(await loadOfficialCards(), c);
    if (off) { if (!c.card || c.card.source !== "club" || JSON.stringify(c.card.pars) !== JSON.stringify(off.pars)) { applyCard(c, { ...off, source: "club" }); save(); return true; } return false; }
    if (c.card && c.card.source === "club") return false;
    const sh = await fetchShared(c);
    if (sh && (!c.card || sh.updated !== c.card.updated)) { applyCard(c, sh); save(); return true; }
    return false;
  }
  const CARD_SOURCE = { club: "Tarjeta oficial del club", usuarios: "Tarjeta compartida por otro golfista", vos: "Tarjeta cargada por vos" };
  const teeYards = (t) => (t.yards || []).reduce((a, b) => a + (+b || 0), 0);
  const fmtDec = (v) => String(v).replace(".", ",");
  // Ranking de handicap de hoyo (1 = el más difícil); sirve también para tarjetas de 9 hoyos numeradas 1-17
  function holeRanks(c) {
    const h = c.card && c.card.hcp;
    if (!h || h.length !== c.pars.length || h.some((x) => !x)) return null;
    const order = h.map((v, i) => ({ v: +v, i })).sort((a, b) => a.v - b.v), rank = [];
    order.forEach((o, k) => { rank[o.i] = k + 1; });
    return rank;
  }
  // Handicap de cancha (WHS): índice × slope / 113 + (rating − par)
  function courseHandicap(p, r) {
    const c = courseOf(r), n = c.pars.length, idx = p.handicap || 0, tee = r.tee;
    const par = c.pars.reduce((a, b) => a + b, 0);
    if (tee && tee.rating && tee.slope) return Math.round((n === 18 ? idx : idx / 2) * tee.slope / 113 + (tee.rating - par));
    return Math.round(idx * n / 18);
  }
  function strokesOnHole(CH, i, c, ranks) {
    const n = c.pars.length, ch = Math.max(0, CH);
    if (!ranks) return null;
    return Math.floor(ch / n) + ((ch % n) >= ranks[i] ? 1 : 0);
  }
  function netScore(p, r) {
    const c = courseOf(r), s = playerStats(p.holes, c.pars), CH = courseHandicap(p, r), ranks = holeRanks(c);
    if (ranks) return s.strokes - p.holes.reduce((t, h, i) => t + (h.strokes ? strokesOnHole(CH, i, c, ranks) : 0), 0);
    return s.strokes - Math.round(Math.max(0, CH) * s.played / c.pars.length);
  }

  async function saveCardEdit() {

  function wayPoints(el) {
    if (el.geometry) return el.geometry.map((g) => ({ lat: g.lat, lng: g.lon }));
    if (el.members) return el.members.filter((m) => m.role !== "inner" && m.geometry).flatMap((m) => m.geometry.map((g) => ({ lat: g.lat, lng: g.lon })));
    return [];
  }
  function simplify(pts, max) {
    if (pts.length <= max) return pts;
    const step = pts.length / max;
    return Array.from({ length: max }, (_, k) => pts[Math.floor(k * step)]);
  }
  function buildCourse(r, elements) {
    const byRef = new Map();
    elements.filter((e) => e.type === "way" && e.tags && e.tags.golf === "hole").forEach((e) => {
      const ref = parseInt(e.tags.ref, 10);
      if (!ref || byRef.has(ref)) return;
      const pts = wayPoints(e);
      if (pts.length < 2) return;
      byRef.set(ref, { pts, par: parseInt(e.tags.par, 10) || null });
    });
    if (!byRef.size) return null;
    const greens = elements.filter((e) => e.tags && e.tags.golf === "green").map((e) => wayPoints(e)).filter((p) => p.length >= 3);
    const pins = elements.filter((e) => e.type === "node" && e.tags && e.tags.golf === "pin").map((e) => ({ lat: e.lat, lng: e.lon }));
    const refs = [...byRef.keys()].sort((a, b) => a - b);
    const course = { id: uid(), name: r.name, pars: [], rating: null, slope: null, greens: {}, greenPolys: {}, holeLines: {}, source: "osm", osm: r.type + "/" + r.id };
    refs.forEach((ref, i) => {
      const h = byRef.get(ref);
      if (!h.par) course.parsGuessed = true;
      course.pars.push(h.par || 4);
      course.holeLines[i] = simplify(h.pts, 30);
      const end = h.pts[h.pts.length - 1];
      let poly = greens.find((g) => pointInPoly(end, g));
      if (!poly) {
        const near = greens.map((g) => ({ g, d: distanceM(end, centroid(g)) })).sort((a, b) => a.d - b.d)[0];
        if (near && near.d < 60) poly = near.g;
      }
      if (poly) {
        course.greenPolys[i] = simplify(poly, 60);
        course.greens[i] = pins.find((p) => pointInPoly(p, poly)) || centroid(poly);
      } else {
        course.greens[i] = end;
      }
    });
    return course;
  }

  /* ================= Estadísticas ================= */
  function playerStats(holes, pars) {
    let strokes = 0, putts = 0, par = 0, played = 0, fw = 0, fwTotal = 0, gir = 0;
    holes.forEach((h, i) => {
      if (!h.strokes) return;
      played++; strokes += h.strokes; putts += h.putts; par += pars[i];
      if (h.fairway === true || h.fairway === false) { fwTotal++; if (h.fairway) fw++; }
      if (h.strokes - h.putts <= pars[i] - 2) gir++;
    });
    return { strokes, putts, par, played, toPar: strokes - par, fw, fwTotal, gir };
  }
  const roundStats = (round) => playerStats(meOf(round).holes, courseOf(round).pars);
  const isFull = (round) => courseOf(round).pars.length === 18 && roundStats(round).played === 18;
  // Handicap de la ronda (aproximado): el índice escalado a la cantidad de hoyos
  const strokesAllowance = (hcp, nHoles) => Math.round((hcp || 0) * nHoles / 18);

  function differential(round) {
    const c = courseOf(round), me = meOf(round), s = roundStats(round);
    const rating = (round.tee && round.tee.rating) || c.rating, slope = (round.tee && round.tee.slope) || c.slope;
    if (!c || !rating || !slope || s.played !== 18) return null;
    // Score ajustado WHS: como máximo doble bogey neto en cada hoyo
    const CH = courseHandicap(me, round), ranks = holeRanks(c);
    const adj = me.holes.reduce((t, h, i) => t + Math.min(h.strokes, c.pars[i] + 2 + (ranks ? strokesOnHole(CH, i, c, ranks) : Math.round(Math.max(0, CH) / 18))), 0);
    return (113 / slope) * (adj - rating);
  }
  function handicapIndex() {
    const diffs = state.data.rounds.filter((r) => r.done).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20)
      .map(differential).filter((d) => d !== null).sort((a, b) => a - b);
    const n = diffs.length;
    if (n < 3) return { value: null, n };
    const table = { 3: [1, -2], 4: [1, -1], 5: [1, 0], 6: [2, -1], 7: [2, 0], 8: [2, 0], 9: [3, 0], 10: [3, 0], 11: [3, 0], 12: [4, 0], 13: [4, 0], 14: [4, 0], 15: [5, 0], 16: [5, 0], 17: [6, 0], 18: [6, 0], 19: [7, 0], 20: [8, 0] };
    const [take, adj] = table[n];
    const avg = diffs.slice(0, take).reduce((a, b) => a + b, 0) / take;
    return { value: Math.round((avg + adj) * 10) / 10, n };
  }
  // Distancia de cada palo: de un tiro registrado al siguiente, sin contar el putter
  function clubDistances() {
    const by = {};
    state.data.rounds.forEach((r) => meOf(r).holes.forEach((h) => {
      for (let k = 0; k < h.shots.length - 1; k++) {
        const s = h.shots[k];
        if (s.club === "Putter") continue;
        const d = yd(distanceM(s, h.shots[k + 1]));
        if (d < 5 || d > 400) continue;
        (by[s.club] = by[s.club] || []).push(d);
      }
    }));
    return CLUBS.filter((c) => by[c]).map((club) => {
      const arr = by[club];
      return { club, avg: Math.round(arr.reduce((a, b) => a + b, 0) / arr.length), max: Math.max(...arr), n: arr.length };
    });
  }

            ${course.card ? `<p class="small"><span class="pill good">${esc(CARD_SOURCE[course.card.source] || "Tarjeta")}</span> <button class="link" id="btn-card">Ver o corregir</button></p>
              ${course.card.tees.length ? `<label class="field" for="tee-select"><span class="label">Salida</span>
                <select id="tee-select">${course.card.tees.map((t, k) => `<option value="${k}" ${k === (state.teeIdx || 0) ? "selected" : ""}>${esc(t.name)}${teeYards(t) ? ` · ${teeYards(t).toLocaleString("es-AR")} yd` : ""}${t.rating ? ` · ${fmtDec(t.rating)} / ${t.slope || "–"}` : ""}</option>`).join("")}</select></label>` : ""}`
              : `<p class="notice">Esta cancha todavía no tiene la tarjeta cargada (par, handicap y yardas de cada hoyo). <button class="link" id="btn-card">Cargar la tarjeta</button></p>`}
            ${parTable(course)}
            ${state.cat.msg ? `<p class="notice">${esc(state.cat.msg)}</p>` : ""}
          </div>`}
      </section>

      <section class="panel">
        <h2>2 · Jugadores <span class="muted small">(${1 + state.guests.length} de ${MAX_PLAYERS})</span></h2>
        <div class="plist">
          <div class="pitem"><div class="field"><span class="small muted">Vos</span><input value="${esc(me.name || "Vos")}" disabled aria-label="Tu nombre"></div>
            <div class="field"><span class="small muted">Handicap</span><input value="${me.handicap}" disabled aria-label="Tu handicap"></div><button class="ghost" style="padding:10px 12px;visibility:hidden" tabindex="-1" aria-hidden="true">✕</button></div>
          ${state.guests.map((g, k) => `<div class="pitem">
            <label class="field" for="g-name-${k}"><span class="small muted">Jugador ${k + 2}</span><input id="g-name-${k}" data-guest="${k}" data-key="name" value="${esc(g.name)}" placeholder="Nombre"></label>
            <label class="field" for="g-hcp-${k}"><span class="small muted">Handicap</span><input id="g-hcp-${k}" data-guest="${k}" data-key="handicap" inputmode="decimal" value="${g.handicap ?? ""}" placeholder="0"></label>
            <button class="ghost" data-remove-guest="${k}" aria-label="Quitar jugador ${k + 2}" style="padding:10px 12px">✕</button></div>`).join("")}
        </div>
        ${state.guests.length < MAX_PLAYERS - 1 ? `<button id="btn-add-guest">Agregar jugador</button>` : ""}
        <button class="primary" id="btn-start" ${course ? "" : "disabled"}>${course ? "Empezar ronda" : "Elegí una cancha para empezar"}</button>
      </section>

      <section class="panel">
        <div class="row between"><h2>Video del tiro</h2><button id="btn-tracer">Abrir</button></div>
        <p class="muted small">Filmá un swing, en el driving o en la cancha, y la app dibuja la línea de la pelota sobre el video.</p>
      </section>

      <section class="panel" id="manual-panel">
        <div class="row between"><h2>Cancha a mano</h2><button class="link" id="btn-new-course">${state.showNewCourse ? "Cancelar" : "Agregar"}</button></div>
        ${state.showNewCourse ? viewNewCourse() : `<p class="muted small">Si tu cancha no está en la lista, cargá los pares de la tarjeta y marcá cada green tocando el mapa la primera vez que la juegues.</p>`}
      </section>`;
  }
  // Lista de canchas: las tuyas primero, después las del mapa, ordenadas por cercanía
  function renderCourseList() {
    const box = $("#course-list");
    if (!box) return;
    const cat = state.cat, f = norm(cat.filter.trim()), pos = state.catPos;
    const km = (it) => pos ? distanceM(pos, { lat: it.lat, lng: it.lon }) / 1000 : null;
    const fmtKm = (d) => d === null ? "" : d < 10 ? d.toFixed(1).replace(".", ",") + " km" : Math.round(d) + " km";
    const savedKeys = new Set(state.data.courses.map((c) => c.osm).filter(Boolean));
    const mine = state.data.courses.filter((c) => !f || norm(c.name).includes(f));
    let items = cat.items.filter((it) => !savedKeys.has(it.key) && (!f || norm(it.name).includes(f) || norm(it.place).includes(f)));
    items = items.map((it) => ({ ...it, d: km(it) }))
      .sort((a, b) => a.d !== null && b.d !== null ? a.d - b.d : (b.holes > 0) - (a.holes > 0) || a.name.localeCompare(b.name));
    const limit = cat.showAll ? 200 : f ? 30 : 8;
    const shown = items.slice(0, limit);
    const status = cat.status === "loading" ? `<p class="muted small">Cargando la lista de canchas de Argentina… (la primera vez tarda unos segundos)</p>`
      : cat.status === "error" ? `<p class="notice bad">No pude bajar la lista de canchas. Revisá tu conexión. <button class="link" id="btn-cat-retry">Reintentar</button></p>` : "";
    box.innerHTML = `
      ${cat.msg ? `<p class="notice">${esc(cat.msg)}</p>` : ""}
      ${mine.length ? `<span class="label">Tus canchas</span><ul class="courselist">${mine.map((c) => `<li><button data-pick-saved="${c.id}">
        <span class="cn">${esc(c.name)}</span><span class="cs muted">${c.pars.length} hoyos · par ${c.pars.reduce((a, b) => a + b, 0)}</span>
        <span class="pill good">Guardada</span></button></li>`).join("")}</ul>` : ""}
      ${status}
      ${cat.status === "ok" ? `<span class="label">${pos ? "Canchas cerca tuyo" : "Canchas de Argentina"}</span>
        ${shown.length ? `<ul class="courselist">${shown.map((it) => `<li><button data-pick="${esc(it.key)}" ${cat.busyKey ? "disabled" : ""}>
          <span class="cn">${esc(it.name)}</span>
          <span class="cs muted">${[it.place, it.par ? `par ${it.par}` : "", fmtKm(it.d)].filter(Boolean).map(esc).join(" · ")}</span>
          ${cat.busyKey === it.key ? `<span class="pill">Cargando…</span>` : it.holes >= 9 ? `<span class="pill good">${it.holes >= 18 ? 18 : it.holes} hoyos en el mapa</span>` : it.holes > 0 ? `<span class="pill">${it.holes} de 18 hoyos en el mapa</span>` : `<span class="pill">Sin hoyos en el mapa</span>`}
        </button></li>`).join("")}</ul>` : `<p class="muted small">No encontré canchas con «${esc(cat.filter)}». Probá con otra palabra o cargala a mano.</p>`}
        ${items.length > shown.length ? `<button class="link" id="btn-more">Ver todas (${items.length})</button>` : ""}
        ${!pos && !cat.locating ? `<p class="muted small">Permití la ubicación para ver primero las canchas cerca tuyo.</p>` : ""}` : ""}`;
  }

  function viewNewCourse() {
    const n = state.newCourseHoles || 18;
    const pars = state.newCoursePars && state.newCoursePars.length === n ? state.newCoursePars : Array(n).fill(4);
    state.newCoursePars = pars;
    return `
        <div class="row">
          <label class="field" for="nc-name"><span class="label">Nombre</span><input id="nc-name" placeholder="Ej.: Golf Club del Norte" value="${esc(state.newCourseName || "")}"></label>
          <label class="field" for="nc-holes" style="flex:0 1 110px"><span class="label">Hoyos</span>
            <select id="nc-holes"><option value="18" ${n === 18 ? "selected" : ""}>18</option><option value="9" ${n === 9 ? "selected" : ""}>9</option></select></label>
        </div>
        <div class="row">
          <label class="field" for="nc-rating"><span class="label">Course rating (opcional)</span><input id="nc-rating" inputmode="decimal" placeholder="Ej.: 71,2"></label>
          <label class="field" for="nc-slope"><span class="label">Slope (opcional)</span><input id="nc-slope" inputmode="numeric" placeholder="Ej.: 125"></label>
        </div>
        <span class="label">Par de cada hoyo</span>
        <div class="pars">${pars.map((p, i) => `<label for="np-${i}">Hoyo ${i + 1}<select id="np-${i}" data-par="${i}">${[3, 4, 5, 6].map((v) => `<option ${v === p ? "selected" : ""}>${v}</option>`).join("")}</select></label>`).join("")}</div>
        <p class="muted small">El course rating y el slope están en la tarjeta del club. Sirven para calcular tu handicap estimado.</p>
        <button class="primary" id="btn-save-course">Guardar cancha</button>`;
  }

  function viewHole() {
    const r = activeRound(), c = courseOf(r), i = state.hole, par = c.pars[i];
    if (state.sel >= r.players.length) state.sel = 0;
    const sp = r.players[state.sel], h = sp.holes[i];
    const multi = r.players.length > 1;
    const hYd = r.tee && r.tee.yards && r.tee.yards[i], hHcp = c.card && c.card.hcp && c.card.hcp[i], ranks = holeRanks(c);
    return `
      <div class="hole-head">
        <button id="prev" aria-label="Hoyo anterior" ${i === 0 ? "disabled" : ""}>‹</button>
        <div class="hole-mid">
          <div class="lbl">${esc(c.name)}</div>
          <div class="big">Hoyo ${i + 1}</div>
          <div class="lbl">Par ${par}${hYd ? ` · ${hYd} yd` : ""}${hHcp ? ` · Hcp ${hHcp}` : ""}</div>
        </div>
        <button id="next" aria-label="Hoyo siguiente" ${i === c.pars.length - 1 ? "disabled" : ""}>›</button>
      </div>

      <section class="panel">
        <div class="row between"><span class="label">Distancia al green (yardas)</span><span class="gps-status" id="gps-status"></span></div>
        <div class="dist">
          <div class="cell"><span class="val" id="d-front">–</span><span class="label">Frente</span></div>
          <div class="cell main"><span class="val" id="d-center">–</span><span class="label">${c.greenPolys[i] ? "Bandera" : "Centro"}</span></div>
          <div class="cell"><span class="val" id="d-back">–</span><span class="label">Fondo</span></div>
        </div>
        <div class="maptoggle">
          <div class="seg" role="group" aria-label="Tipo de mapa">
            <button data-mapmode="2d" aria-pressed="${state.data.prefs.mapMode !== "3d"}">Mapa</button>
            <button data-mapmode="3d" aria-pressed="${state.data.prefs.mapMode === "3d"}">3D</button>
          </div>
          ${state.data.prefs.mapMode === "3d" ? `<div class="row"><button id="btn-fly">Recorrer el hoyo</button><button class="ghost" id="btn-overview">Vista general</button></div>` : ""}
        </div>
        <div id="map" class="${state.data.prefs.mapMode === "3d" ? "is3d" : ""}" role="application" aria-label="Mapa del hoyo"></div>
        <p class="muted small" id="map-note"></p>
        <div class="row">
          <button id="btn-green" class="${state.setGreenMode ? "flag" : ""}">${state.setGreenMode ? "Tocá la bandera en el mapa" : (c.greens[i] ? "Mover la bandera" : "Marcar el green")}</button>
          <button id="btn-green-here">Estoy en el green</button>
        </div>
      </section>

      <section class="panel">
        <div class="players">
          <div class="phead"><span class="label">${multi ? "Jugador" : ""}</span><span class="label">Golpes</span><span class="label">Putts</span></div>
          ${r.players.map((p, k) => {
            const ph = p.holes[i];
            return `<div class="prow">
              <button class="pname" data-sel="${k}" aria-pressed="${k === state.sel}" aria-label="Elegir a ${esc(p.name)}">
                <span class="n">${esc(p.name)}${(() => { const st = strokesOnHole(courseHandicap(p, r), i, c, ranks); return st ? ` <span class="muted small" title="Golpes de ventaja en este hoyo">+${st}</span>` : ""; })()}</span>
                ${ph.strokes ? scoreName(ph.strokes - par) : `<span class="small muted">${totalLabel(p, c)}</span>`}
              </button>
              ${stepper(k, "strokes", ph.strokes, p.name)}
              ${stepper(k, "putts", ph.putts, p.name)}
            </div>`;
          }).join("")}
        </div>
        <div class="row between">
          <div class="row"><span class="label">Penales${multi ? " de " + esc(sp.name) : ""}</span>${stepper(state.sel, "penalties", h.penalties, sp.name)}</div>
          ${par === 3 ? "" : `<div class="row"><span class="label">Fairway</span>
            <div class="seg" role="group" aria-label="Fairway acertado">
              <button data-fw="1" aria-pressed="${h.fairway === true}">Sí</button>
              <button data-fw="0" aria-pressed="${h.fairway === false}">No</button>
            </div></div>`}
        </div>
        ${multi ? `<p class="muted small">Tocá un nombre para elegir a quién corresponden los penales, el fairway y los tiros.</p>` : ""}
      </section>

      <section class="panel">
        <div class="row between"><h2>Tiros${multi ? " de " + esc(sp.name) : ""}</h2><span class="label">${h.shots.length} registrados</span></div>
        <div class="row">
          <label class="field" for="club"><span class="label">Palo</span>
            <select id="club">${CLUBS.map((cl) => `<option ${cl === state.club ? "selected" : ""}>${cl}</option>`).join("")}</select></label>
          <button class="primary" id="btn-shot" style="align-self:flex-end">Registrar tiro</button>
        </div>
        <button id="btn-tracer">Video del tiro con trayectoria</button>
        ${h.shots.length ? `<ol class="shots">${h.shots.map((sh, k) => {
          const next = h.shots[k + 1];
          const len = next ? `${yd(distanceM(sh, next))} yd` : (c.greens[i] ? `a ${yd(distanceM(sh, c.greens[i]))} yd de la bandera` : "");
          return `<li><span class="shot-n">${k + 1}</span><span>${esc(sh.club)}</span><span class="num">${len}</span></li>`;
        }).join("")}</ol>
        <button class="link" id="btn-undo-shot" style="align-self:flex-start">Borrar el último tiro</button>` : `<p class="muted">Parate donde está la pelota, elegí el palo y tocá <b>Registrar tiro</b> antes de pegarle. La distancia se calcula con la posición del tiro siguiente.</p>`}
      </section>

      <section class="panel">
        <h2>Tarjeta</h2>
        ${scorecard(r, c)}
        <button class="flag" id="btn-finish">Terminar ronda</button>
        <button class="ghost" id="btn-discard">Descartar ronda</button>
        <div id="discard-confirm" hidden class="notice">
          ¿Seguro? Se borra esta ronda y no se puede recuperar.
          <div class="row" style="margin-top:8px"><button id="discard-yes">Sí, descartar</button><button id="discard-no">Cancelar</button></div>
        </div>
      </section>`;
  }

  function totalLabel(p, c) {
    const s = playerStats(p.holes, c.pars);
    return s.played ? `Total ${signed(s.toPar)}` : "Sin golpes";
  }
  function stepper(k, key, val, name) {
    const words = { strokes: "golpes", putts: "putts", penalties: "penales" };
    return `<div class="stepper"><button data-dec="${key}" data-p="${k}" aria-label="Restar ${words[key]} a ${esc(name)}">−</button><span class="v">${val}</span><button data-inc="${key}" data-p="${k}" aria-label="Sumar ${words[key]} a ${esc(name)}">+</button></div>`;
  }
  function scoreName(diff) {
    const names = { "-3": "Albatros", "-2": "Eagle", "-1": "Birdie", "0": "Par", "1": "Bogey", "2": "Doble bogey", "3": "Triple bogey" };
    const n = names[String(diff)] || (diff > 0 ? `+${diff}` : String(diff));
    const cls = diff < 0 ? "good" : diff > 0 ? "bad" : "";
    return `<span class="pill ${cls}">${n}</span>`;
  }

  // Pares de cada hoyo de la cancha elegida (con handicap y yardas de la salida si hay tarjeta)
  function parTable(c) {
    const n = c.pars.length, tee = c.card && c.card.tees[state.teeIdx || 0];
    const halves = n === 18 ? [[0, 9], [9, 18]] : [[0, n]];
    return `<div class="card-scroll" aria-label="Pares de cada hoyo">${halves.map(([a, b]) => {
      const idx = Array.from({ length: b - a }, (_, k) => a + k), sum = (f) => idx.reduce((t, k) => t + (+f(k) || 0), 0);
      return `<table class="score" style="margin-bottom:8px">
        <tr><th>Hoyo</th>${idx.map((k) => `<th>${k + 1}</th>`).join("")}<th>${a === 0 ? (b === 9 && n === 18 ? "Ida" : "Tot") : "Vta"}</th></tr>
        <tr><th>Par</th>${idx.map((k) => `<td><b>${c.pars[k]}</b></td>`).join("")}<td><b>${sum((k) => c.pars[k])}</b></td></tr>
        ${c.card && c.card.hcp && c.card.hcp.some(Boolean) ? `<tr><th>Hcp</th>${idx.map((k) => `<td class="small muted">${c.card.hcp[k] || ""}</td>`).join("")}<td></td></tr>` : ""}
        ${tee && tee.yards && tee.yards.some(Boolean) ? `<tr><th>Yardas</th>${idx.map((k) => `<td class="small">${tee.yards[k] || ""}</td>`).join("")}<td class="small">${sum((k) => tee.yards[k]) || ""}</td></tr>` : ""}
      </table>`;
    }).join("")}${n === 18 ? `<p class="muted small" style="margin:0">Total: par ${c.pars.reduce((a, b) => a + b, 0)}</p>` : ""}</div>`;
  }
  function scorecard(r, c) {
    const halves = c.pars.length === 18 ? [[0, 9], [9, 18]] : [[0, c.pars.length]];
    const live = r.id === state.data.activeRoundId;
    const single = r.players.length === 1;
    return `<div class="card-scroll">${halves.map(([a, b]) => {
      const idx = Array.from({ length: b - a }, (_, k) => a + k);
      const sum = (f) => idx.reduce((t, k) => t + f(k), 0);
      const totalHead = a === 0 ? (b === 9 ? "Ida" : "Tot") : "Vta";
      const rows = r.players.map((p) => `<tr><th title="${esc(p.name)}">${esc(single ? "Golpes" : p.name)}</th>${idx.map((k) => {
          const st = p.holes[k].strokes, d = st - c.pars[k];
          const cls = [live && k === state.hole ? "cur" : "", st ? (d < 0 ? "birdie" : d > 0 ? "bogey" : "") : ""].join(" ");
          return `<td class="${cls}">${st || ""}</td>`;
        }).join("")}<td>${sum((k) => p.holes[k].strokes) || ""}</td></tr>`).join("");
      const me = meOf(r);
      const putts = single ? `<tr><th>Putts</th>${idx.map((k) => `<td>${me.holes[k].strokes ? me.holes[k].putts : ""}</td>`).join("")}<td>${sum((k) => me.holes[k].putts) || ""}</td></tr>` : "";
      return `<table class="score" style="margin-bottom:8px">
        <tr><th>Hoyo</th>${idx.map((k) => `<th>${k + 1}</th>`).join("")}<th>${totalHead}</th></tr>
        ${r.tee && r.tee.yards && r.tee.yards.some(Boolean) ? `<tr><th>Yardas</th>${idx.map((k) => `<td class="small">${r.tee.yards[k] || ""}</td>`).join("")}<td class="small">${sum((k) => +r.tee.yards[k] || 0) || ""}</td></tr>` : ""}
        <tr><th>Par</th>${idx.map((k) => `<td>${c.pars[k]}</td>`).join("")}<td>${sum((k) => c.pars[k])}</td></tr>
        ${c.card && c.card.hcp && c.card.hcp.length ? `<tr><th>Hcp</th>${idx.map((k) => `<td class="small muted">${c.card.hcp[k] || ""}</td>`).join("")}<td></td></tr>` : ""}
        ${rows}${putts}
      </table>`;
    }).join("")}</div>`;
  }

  // Resultado de la ronda: gross y neto de cada jugador
  function leaderboard(r) {
    const c = courseOf(r);
    return r.players.map((p) => {
      const s = playerStats(p.holes, c.pars);
      return { name: p.name, gross: s.strokes, toPar: s.toPar, net: netScore(p, r), played: s.played, ch: courseHandicap(p, r) };
    }).sort((a, b) => a.net - b.net || a.gross - b.gross);
  }
  function viewResults(roundId) {
    const r = state.data.rounds.find((x) => x.id === roundId);
    if (!r || r.players.length < 2) return "";
    const rows = leaderboard(r);
    return `<section class="panel">
      <div class="row between"><h2>Resultado de la ronda</h2><button class="link" id="btn-close-results">Cerrar</button></div>
      ${boardTable(rows, r)}
    </section>`;
  }
  function boardTable(rows, r) {
    const c = r && courseOf(r), whs = r && r.tee && r.tee.rating && r.tee.slope, byHole = c && holeRanks(c);
    return `<table class="board">
      <tr><th class="label"></th><th class="label" style="text-align:left">Jugador</th><th class="label">Gross</th><th class="label">Neto</th></tr>
      ${rows.map((x, k) => `<tr><td class="pos">${k + 1}</td><td style="text-align:left">${esc(x.name)}${x.played < 18 && x.played ? ` <span class="muted small">(${x.played} hoyos)</span>` : ""}</td>
        <td class="big">${x.gross || "–"} <span class="muted small">${x.gross ? signed(x.toPar) : ""}</span></td><td class="big">${x.gross ? x.net : "–"}</td></tr>`).join("")}
    </table>
    <p class="muted small">${whs ? "Neto = golpes menos el handicap de cancha de cada jugador (sistema WHS, con el rating y el slope de la salida)" : "Neto = golpes menos el handicap de cada jugador (aproximado: falta el rating y el slope de la salida)"}${byHole ? ", con los golpes de ventaja repartidos según el handicap de cada hoyo." : "."}</p>`;
  }

  /* ---------- Historial ---------- */
  function viewHistory() {
    const done = state.data.rounds.filter((r) => r.done).sort((a, b) => b.date.localeCompare(a.date));
    const p = state.data.profile;
    if (!done.length) return `<header><h1>Historial</h1></header><section class="panel"><p class="muted">Todavía no terminaste ninguna ronda. Cuando termines la primera, vas a ver acá tus estadísticas y cómo jugaste según tu handicap.</p></section>`;
    const full = done.filter(isFull).map((r) => ({ r, s: roundStats(r) }));
    const avg = (f) => full.length ? full.reduce((t, x) => t + f(x), 0) / full.length : 0;
    const fwPct = (() => { const t = full.reduce((a, x) => a + x.s.fwTotal, 0); return t ? Math.round(100 * full.reduce((a, x) => a + x.s.fw, 0) / t) : null; })();
    const girPct = (() => { const t = full.reduce((a, x) => a + x.s.played, 0); return t ? Math.round(100 * full.reduce((a, x) => a + x.s.gir, 0) / t) : null; })();
    const hi = handicapIndex();
    const last = full[0];
    const lastHcp = last ? (meOf(last.r).handicap ?? p.handicap) : 0;
    const expected = last ? last.s.par + Math.max(0, courseHandicap(meOf(last.r), last.r)) : null;
    const anyExample = done.some((r) => r.example);
    const clubs = clubDistances();
    return `
      <header class="row between"><h1>Historial</h1>${anyExample ? `<span class="pill">Incluye ejemplos</span>` : ""}</header>
      ${last ? `<section class="panel">
        <span class="label">Última ronda · ${fmtDate(last.r.date)}</span>
        <div class="row between"><h2>${esc(courseOf(last.r).name)}</h2><span class="num" style="font-size:34px;font-weight:700">${last.s.strokes}</span></div>
        <p>Con handicap ${lastHcp}, lo esperado era unos <b class="num">${expected}</b> golpes.
          ${last.s.strokes <= expected ? `<span class="pill good">${expected - last.s.strokes} golpes mejor</span>` : `<span class="pill bad">${last.s.strokes - expected} golpes arriba</span>`}</p>
        <p class="muted">${insight(last.s, p)}</p>
        ${last.r.players.length > 1 ? boardTable(leaderboard(last.r), last.r) : ""}
      </section>` : ""}

      <section class="panel">
        <h2>Evolución del score</h2>
        <p class="muted small">Rondas completas de 18 hoyos.</p>
        ${scoreChart(full.slice().reverse())}
      </section>

      <section class="panel">
        <h2>Promedios</h2>
        <div class="stats">
          <div class="stat"><span class="label">Score</span><span class="v">${full.length ? avg((x) => x.s.strokes).toFixed(1) : "–"}</span></div>
          <div class="stat"><span class="label">Putts</span><span class="v">${full.length ? avg((x) => x.s.putts).toFixed(1) : "–"}</span></div>
          <div class="stat"><span class="label">Fairways</span><span class="v">${fwPct !== null ? fwPct + "%" : "–"}</span></div>
          <div class="stat"><span class="label">Greens en regulación</span><span class="v">${girPct !== null ? girPct + "%" : "–"}</span></div>
          <div class="stat"><span class="label">Handicap estimado</span><span class="v">${hi.value !== null ? hi.value.toFixed(1) : "–"}</span>
            <span class="muted small">${hi.value !== null ? `con ${hi.n} rondas` : `faltan ${Math.max(0, 3 - hi.n)} rondas de 18 hoyos con rating y slope`}</span></div>
        </div>
        <p class="muted small">El handicap estimado usa la fórmula del sistema mundial (WHS). No es oficial: el oficial lo lleva la asociación de golf de tu país.</p>
      </section>

      <section class="panel">
        <h2>Distancia por palo</h2>
        ${clubs.length ? clubChart(clubs) : `<p class="muted">Registrá tus tiros durante la ronda para ver cuántas yardas le pegás con cada palo.</p>`}
      </section>

      <section class="panel">
        <h2>Rondas</h2>
        <ul class="round-list">${done.map((r) => {
          const s = roundStats(r), n = courseOf(r).pars.length;
          const others = r.players.length > 1 ? ` · con ${r.players.filter((x) => !x.isMe).map((x) => esc(x.name)).join(", ")}` : "";
          return `<li>
          <span><b>${esc(courseOf(r).name)}</b>${r.example ? ` <span class="pill">Ejemplo</span>` : ""}</span>
          <span class="round-score">${s.strokes}</span>
          <span class="muted small">${fmtDate(r.date)} · ${signed(s.toPar)} · ${s.putts} putts${s.played < n ? ` · ${s.played} de ${n} hoyos` : ""}${others}</span></li>`; }).join("")}</ul>
      </section>`;
  }

  // Gráfico de línea del score de cada ronda completa
  function scoreChart(rounds) {
    if (rounds.length < 2) return `<p class="muted">Cuando tengas 2 rondas completas de 18 hoyos, acá vas a ver si tu score baja.</p>`;
    const pts = rounds.slice(-15).map((x) => ({ v: x.s.strokes, toPar: x.s.toPar, date: x.r.date, course: courseOf(x.r).name }));
    const W = 340, H = 170, L = 30, R = 34, T = 12, B = 26;
    const vals = pts.map((p) => p.v);
    let lo = Math.floor((Math.min(...vals) - 2) / 5) * 5, hi = Math.ceil((Math.max(...vals) + 2) / 5) * 5;
    if (hi - lo < 10) hi = lo + 10;
    const x = (k) => L + (pts.length === 1 ? 0 : k * (W - L - R) / (pts.length - 1));
    const y = (v) => T + (hi - v) * (H - T - B) / (hi - lo);
    const step = hi - lo > 30 ? 10 : 5; lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const ticks = []; for (let t = lo; t <= hi; t += step) ticks.push(t);
    const path = pts.map((p, k) => `${k ? "L" : "M"}${x(k).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    const lastP = pts[pts.length - 1], first = pts[0];
    const delta = lastP.v - first.v;
    state.chartPts = pts;
    return `<div class="chart">
      <p class="small">${delta < 0 ? `<span class="pill good">${-delta} golpes menos</span> que en tu primera ronda del gráfico.` : delta > 0 ? `<span class="pill bad">${delta} golpes más</span> que en tu primera ronda del gráfico.` : "Mismo score que en tu primera ronda del gráfico."}</p>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score de tus últimas ${pts.length} rondas, de ${first.v} a ${lastP.v} golpes">
        ${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
        <path d="${path}" fill="none" stroke="var(--fairway)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${pts.map((p, k) => `<circle class="hit" data-pt="${k}" cx="${x(k)}" cy="${y(p.v)}" r="14"><title>${fmtShort(p.date)}: ${p.v} golpes</title></circle><circle class="pt" data-ptv="${k}" cx="${x(k)}" cy="${y(p.v)}" r="4" fill="var(--fairway)" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>`).join("")}
        <text class="endlabel" x="${x(pts.length - 1) + 8}" y="${y(lastP.v) + 5}">${lastP.v}</text>
        <text x="${x(0)}" y="${H - 6}" text-anchor="start">${fmtShort(first.date)}</text>
        <text x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end">${fmtShort(lastP.date)}</text>
      </svg>
      <p class="tip muted" id="chart-tip">Tocá un punto para ver la ronda.</p>
    </div>`;
  }
  function bindChart() {
    const tip = $("#chart-tip");
    if (!tip) return;
    const show = (k) => {
      const p = state.chartPts[k];
      document.querySelectorAll(".chart .pt").forEach((c) => c.classList.toggle("active", c.dataset.ptv === String(k)));
      tip.innerHTML = `<b>${fmtDate(p.date)}</b> · ${esc(p.course)} · <b class="num">${p.v}</b> golpes (${signed(p.toPar)})`;
    };
    document.querySelectorAll(".chart .hit").forEach((el) => {
      el.addEventListener("mouseenter", () => show(+el.dataset.pt));
      el.addEventListener("click", () => show(+el.dataset.pt));
    });
  }
  function clubChart(clubs) {
    const max = Math.max(...clubs.map((c) => c.max));
    return `<div class="clubs">${clubs.map((c) => `<div class="club" title="${esc(c.club)}: promedio ${c.avg} yd, máximo ${c.max} yd, ${c.n} tiros">
      <span class="name">${esc(c.club)}</span>
      <div class="track"><div class="bar" style="width:${(100 * c.avg / max).toFixed(1)}%"></div></div>
      <span class="yd">${c.avg}</span>
      <span class="sub">máx. ${c.max} yd · ${c.n} ${c.n === 1 ? "tiro" : "tiros"}</span>
    </div>`).join("")}</div>
    <p class="muted small">Promedio en yardas, de cada tiro registrado al siguiente. Si un tiro no se registró, el anterior queda más largo: borralo desde el hoyo.</p>`;
  }

  function insight(s, p) {
    const puttsPerHole = s.putts / s.played;
    const target = p.level === "principiante" ? 2.1 : p.level === "avanzado" ? 1.75 : 1.9;
    if (puttsPerHole > target + 0.1) return `Tus putts (${s.putts}) están por encima de lo habitual para tu nivel. Practicar putts de 1 a 2 metros es lo que más golpes te puede ahorrar.`;
    if (s.fwTotal && s.fw / s.fwTotal < 0.4) return `Acertaste ${s.fw} de ${s.fwTotal} fairways. Probá con un palo más corto desde el tee en los hoyos angostos.`;
    if (s.gir / s.played < 0.2) return `Llegaste a ${s.gir} greens en regulación. Trabajar los tiros de aproximación te va a dar más chances de birdie.`;
    return "Ronda pareja en todas las áreas del juego. Seguí registrando tiros para ver tu distancia real con cada palo.";
  }

  /* ================= Mapa ================= */
  function setupMap() {
    const el = $("#map"), note = $("#map-note");
    if (!el) return;
    if (typeof L === "undefined") { el.hidden = true; note.textContent = "El mapa no se pudo cargar. Revisá tu conexión."; return; }
    const r = activeRound(), c = courseOf(r), i = state.hole, g = c.greens[i], line = c.holeLines[i];
    map = L.map(el, { zoomControl: true, attributionControl: true });
    if (line && line.length > 1) map.fitBounds(L.latLngBounds(line.map((p) => [p.lat, p.lng])).pad(0.15));
    else { const center = g || state.pos || c.center || { lat: -34.6037, lng: -58.3816 }; map.setView([center.lat, center.lng], g || state.pos || c.center ? 17 : 12); }
    const tiles = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 20, maxNativeZoom: 19, attribution: "Imágenes © Esri · Canchas © OpenStreetMap",
    }).addTo(map);
    let errors = 0;
    tiles.on("tileerror", () => { if (++errors > 3 && !tilesFailed) { tilesFailed = true; note.textContent = "Las imágenes satelitales no cargan en esta vista. En tu link de GitHub sí se ven."; } });
    mapLayers = L.layerGroup().addTo(map);
    map.on("click", (e) => {
      if (!state.setGreenMode) return;
      const pt = { lat: e.latlng.lat, lng: e.latlng.lng };
      // Si hay contorno y se toca adentro, se mueve solo la bandera; si se toca afuera, se descarta el contorno
      if (c.greenPolys[i] && !pointInPoly(pt, c.greenPolys[i])) delete c.greenPolys[i];
      c.greens[i] = pt;
      state.setGreenMode = false; save(); render();
    });
    drawMap();
    if (!tilesFailed) note.textContent = g ? "" : "Tocá «Marcar el green» y después el green en el mapa.";
  }
  function drawMap() {
    draw3D();
    if (!map || !mapLayers) return;
    mapLayers.clearLayers();
    const r = activeRound(), c = courseOf(r), i = state.hole, h = r.players[state.sel].holes[i], g = c.greens[i];
    if (c.holeLines[i]) L.polyline(c.holeLines[i].map((p) => [p.lat, p.lng]), { color: "#FFFFFF", weight: 2, opacity: 0.7, dashArray: "2 6" }).addTo(mapLayers);
    if (c.greenPolys[i]) L.polygon(c.greenPolys[i].map((p) => [p.lat, p.lng]), { color: "#E2B529", weight: 2, fillOpacity: 0.12 }).addTo(mapLayers);
    const pts = h.shots.map((s) => [s.lat, s.lng]);
    if (pts.length) L.polyline(pts.concat(g ? [[g.lat, g.lng]] : []), { color: "#E2B529", weight: 3, dashArray: "6 6" }).addTo(mapLayers);
    h.shots.forEach((s, k) => L.circleMarker([s.lat, s.lng], { radius: 6, color: "#FFFFFF", weight: 2, fillColor: "#1F6B3A", fillOpacity: 1 }).bindTooltip(`Tiro ${k + 1}: ${s.club}`).addTo(mapLayers));
    if (g) {
      if (!c.greenPolys[i]) L.circle([g.lat, g.lng], { radius: 14, color: "#E2B529", weight: 2, fillOpacity: 0.12 }).addTo(mapLayers);
      L.circleMarker([g.lat, g.lng], { radius: 5, color: "#E2B529", fillColor: "#E2B529", fillOpacity: 1 }).bindTooltip("Bandera").addTo(mapLayers);
    }
    if (state.pos) L.circleMarker([state.pos.lat, state.pos.lng], { radius: 8, color: "#FFFFFF", weight: 3, fillColor: "#2F7DE1", fillOpacity: 1 }).bindTooltip("Vos").addTo(mapLayers);
  }

  /* ================= Vista 3D (relieve + satélite, sin costo) ================= */
  let map3d = null, mlPromise = null;
  function loadMapLibre() {
    if (window.maplibregl) return Promise.resolve();
    if (!mlPromise) mlPromise = new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = MAPLIBRE_JS; sc.onload = res; sc.onerror = () => { mlPromise = null; rej(new Error("no cargó")); };
      document.head.appendChild(sc);
    });
    return mlPromise;
  }
  function holeGeo() {
    const r = activeRound(), c = courseOf(r), i = state.hole, h = r.players[state.sel].holes[i];
    const line = c.holeLines[i];
    const green = c.greens[i] || null;
    const tee = (line && line[0]) || (h.shots[0]) || state.pos || null;
    return { r, c, i, h, line, green, tee, poly: c.greenPolys[i] };
  }
  const ll = (p) => [p.lng, p.lat];
  const fc = (features) => ({ type: "FeatureCollection", features });
  const feat = (geometry, properties = {}) => ({ type: "Feature", geometry, properties });
  async function setup3D() {
    const el = $("#map"), note = $("#map-note");
    if (!el) return;
    note.textContent = "Cargando la vista 3D…";
    try { await loadMapLibre(); } catch (e) { note.textContent = "No se pudo cargar la vista 3D. Revisá tu conexión, o usá «Mapa»."; return; }
    if (!el.isConnected || state.data.prefs.mapMode !== "3d") return;
    const g = holeGeo();
    const start = g.green || g.tee || g.c.center || { lat: -34.6037, lng: -58.3816 };
    let m;
    try {
      m = new maplibregl.Map({
        container: el, center: ll(start), zoom: g.green || g.tee ? 16.5 : 11, pitch: 60, maxPitch: 75,
        attributionControl: { compact: false },
        style: {
          version: 8,
          sources: {
            sat: { type: "raster", tiles: [SAT_TILES], tileSize: 256, maxzoom: 19, attribution: "Imágenes © Esri" },
            dem: { type: "raster-dem", tiles: [DEM_TILES], tileSize: 256, maxzoom: 15, encoding: "terrarium", attribution: "Relieve © Mapzen/AWS · Canchas © OpenStreetMap" },
          },
          layers: [{ id: "sat", type: "raster", source: "sat" }],
          terrain: { source: "dem", exaggeration: 1.6 },
        },
      });
    } catch (e) { note.textContent = "Este celular no puede mostrar la vista 3D. Usá «Mapa»."; return; }
    map3d = m;
    let tileErrors = 0;
    m.on("error", () => { if (++tileErrors === 4) note.textContent = "El satélite o el relieve no cargan acá. En tu link de GitHub sí se ven."; });
    m.on("load", () => {
      if (map3d !== m) return;
      ["hole", "green", "shots", "pts", "flag", "me"].forEach((id) => m.addSource(id, { type: "geojson", data: fc([]) }));
      m.addLayer({ id: "hole", type: "line", source: "hole", paint: { "line-color": "#FFFFFF", "line-width": 2, "line-opacity": 0.8, "line-dasharray": [1, 2] } });
      m.addLayer({ id: "green-fill", type: "fill", source: "green", paint: { "fill-color": "#E2B529", "fill-opacity": 0.18 } });
      m.addLayer({ id: "green-line", type: "line", source: "green", paint: { "line-color": "#E2B529", "line-width": 2 } });
      m.addLayer({ id: "shots", type: "line", source: "shots", paint: { "line-color": "#FFD23F", "line-width": 3, "line-dasharray": [2, 2] } });
      m.addLayer({ id: "pts", type: "circle", source: "pts", paint: { "circle-radius": 6, "circle-color": "#1F6B3A", "circle-stroke-color": "#FFFFFF", "circle-stroke-width": 2 } });
      m.addLayer({ id: "flag", type: "circle", source: "flag", paint: { "circle-radius": 6, "circle-color": "#E2B529", "circle-stroke-color": "#1E1A08", "circle-stroke-width": 1.5 } });
      m.addLayer({ id: "me", type: "circle", source: "me", paint: { "circle-radius": 8, "circle-color": "#2F7DE1", "circle-stroke-color": "#FFFFFF", "circle-stroke-width": 3 } });
      draw3D(); frameHole(false);
      if (tileErrors < 4) note.textContent = g.green ? "Arrastrá con dos dedos para inclinar o girar." : "Tocá «Marcar el green» y después el green en el mapa.";
    });
    m.on("click", (e) => {
      if (!state.setGreenMode) return;
      const c = courseOf(activeRound()), i = state.hole, pt = { lat: e.lngLat.lat, lng: e.lngLat.lng };
      if (c.greenPolys[i] && !pointInPoly(pt, c.greenPolys[i])) delete c.greenPolys[i];
      c.greens[i] = pt; state.setGreenMode = false; save(); render();
    });
  }
  function draw3D() {
    const m = map3d;
    if (!m || !m.getSource || !m.getSource("hole")) return;
    const g = holeGeo();
    const holeLine = g.line && g.line.length > 1 ? g.line : (g.tee && g.green ? [g.tee, g.green] : null);
    m.getSource("hole").setData(fc(holeLine ? [feat({ type: "LineString", coordinates: holeLine.map(ll) })] : []));
    const area = g.poly || (g.green ? circlePoly(g.green, 14) : null);
    m.getSource("green").setData(fc(area ? [feat({ type: "Polygon", coordinates: [area.map(ll)] })] : []));
    const sp = g.h.shots.map(ll).concat(g.green && g.h.shots.length ? [ll(g.green)] : []);
    m.getSource("shots").setData(fc(sp.length > 1 ? [feat({ type: "LineString", coordinates: sp })] : []));
    m.getSource("pts").setData(fc(g.h.shots.map((s) => feat({ type: "Point", coordinates: ll(s) }))));
    m.getSource("flag").setData(fc(g.green ? [feat({ type: "Point", coordinates: ll(g.green) })] : []));
    m.getSource("me").setData(fc(state.pos ? [feat({ type: "Point", coordinates: ll(state.pos) })] : []));
  }
  // Cámara: del tee mirando al green, inclinada
  function frameHole(animate) {
    const m = map3d; if (!m) return;
    const g = holeGeo();
    const from = g.tee, to = g.green;
    if (from && to && distanceM(from, to) > 20) {
      const bearing = bearingDeg(from, to);
      const pts = (g.line || [from, to]).concat(g.poly || []);
      const b = new maplibregl.LngLatBounds(ll(pts[0]), ll(pts[0]));
      pts.forEach((p) => b.extend(ll(p)));
      const cam = m.cameraForBounds(b, { padding: 30, bearing }) || {};
      const opts = { center: cam.center || ll(to), zoom: (cam.zoom || 16.5) - 0.3, bearing, pitch: 60 };
      animate ? m.easeTo({ ...opts, duration: 1600 }) : m.jumpTo(opts);
    } else {
      const c = to || from || state.pos; if (!c) return;
      const opts = { center: ll(c), zoom: 17.5, pitch: 55 };
      animate ? m.easeTo({ ...opts, duration: 1200 }) : m.jumpTo(opts);
    }
  }
  // Vuelo de la cámara desde el tee hasta el green
  function flyHole() {
    const m = map3d; if (!m) return;
    const g = holeGeo();
    if (!g.tee || !g.green) { $("#map-note").textContent = "Para recorrer el hoyo hace falta el green marcado y el tee (o tu posición)."; return; }
    const bearing = bearingDeg(g.tee, g.green), d = distanceM(g.tee, g.green);
    m.stop();
    m.jumpTo({ center: ll(g.tee), zoom: 18.2, pitch: 72, bearing });
    m.easeTo({ center: ll(g.green), zoom: 18.6, pitch: 64, bearing, duration: Math.max(3500, Math.min(9000, d * 22)), easing: (t) => t * (2 - t) });
    m.once("moveend", () => setTimeout(() => { if (map3d === m) frameHole(true); }, 1200));
  }

  /* ================= Video del tiro con trayectoria ================= */
  let tracerRaf = null;
  function stopTracerLoop() { if (tracerRaf) cancelAnimationFrame(tracerRaf); tracerRaf = null; }
  function newTracer() {
    return { url: null, file: null, name: "", mode: "auto", step: 0, p0: null, p1: null, p2: null, t0: 0, t2: 0, path: null,
      auto: { state: "idle", phase: "", prog: 0 }, cancel: false, exportUrl: null, exportType: "", busy: false, msg: "" };
  }
  const STEP_TEXT = [
    "Mové la barra hasta el momento del impacto y tocá la pelota.",
    "Tocá el punto más alto al que llegó la pelota. Podés mover el video para encontrarlo.",
    "Mové el video hasta donde la pelota cae o deja de verse, y tocá ese lugar.",
    "Listo. Tocá ▶ para ver la trayectoria.",
  ];
  function viewTracer() {
    const t = state.tracer;
    const color = state.data.prefs.traceColor;
    if (!t.url) return `
      <header class="row between"><h1>Video del tiro</h1><button class="link" id="tr-back">Volver</button></header>
      <section class="panel">
        <h2>Cómo filmar para que la app siga la pelota</h2>
        <ol class="steps">
          <li><span class="k">1</span><span>Celular <b>quieto</b> atrás del jugador, en la línea del tiro (en un trípode o apoyado en la bolsa).</span></li>
