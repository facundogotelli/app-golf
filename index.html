<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F6B3A">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Libreta de Golf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: una libreta de yardas de bolsillo. Encabezado del hoyo arriba, distancia grande, score abajo, pestañas fijas al pie. */
:root {
  --bg: #F3F5EF;          /* papel de tarjeta con tinte verde */
  --surface: #FFFFFF;
  --ink: #17251B;          /* verde casi negro */
  --muted: #5E6B60;
  --line: #D7DDD2;
  --fairway: #1F6B3A;      /* acento principal */
  --fairway-ink: #FFFFFF;
  --flag: #E2B529;         /* bandera amarilla */
  --sand: #EDE3C8;
  --good: #1F7A45;
  --bad: #B3402C;
  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1712; --surface: #17221B; --ink: #E7EEE6; --muted: #9AA99C; --line: #2A3A2F;
    --fairway: #3E9E62; --fairway-ink: #08130C; --flag: #EFC646; --sand: #3A3524; --good: #5CC489; --bad: #E77A63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1712; --surface: #17221B; --ink: #E7EEE6; --muted: #9AA99C; --line: #2A3A2F;
  --fairway: #3E9E62; --fairway-ink: #08130C; --flag: #EFC646; --sand: #3A3524; --good: #5CC489; --bad: #E77A63;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px calc(84px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-num); font-weight: 700; font-size: 28px; letter-spacing: .02em; }
h2 { font-family: var(--font-num); font-weight: 600; font-size: 22px; letter-spacing: .02em; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
button, select, input {
  font: inherit; color: inherit;
}
button {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 600;
}
button.primary { background: var(--fairway); color: var(--fairway-ink); border-color: var(--fairway); }
button.flag { background: var(--flag); color: #1E1A08; border-color: var(--flag); }
button.ghost { background: transparent; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }
input, select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; min-width: 0; }

/* Encabezado del hoyo */
.hole-head { background: var(--fairway); color: var(--fairway-ink); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
.hole-head .big { font-family: var(--font-num); font-size: 44px; line-height: 1; font-weight: 700; }
.hole-head .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; opacity: .85; }
.hole-head button { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--fairway-ink) 40%, transparent); padding: 8px 12px; font-size: 20px; line-height: 1; }
.hole-mid { text-align: center; }

/* Distancia */
.dist { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.dist .cell { display: flex; flex-direction: column; gap: 2px; }
.dist .val { font-family: var(--font-num); font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.dist .cell.main .val { font-size: 56px; color: var(--fairway); }
.gps-status { font-size: 13px; display: flex; gap: 6px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--good); }
.dot.off { background: var(--bad); }

#map { height: 260px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--sand); }
.map-note { font-size: 13px; }

/* Contadores */
.counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.counter { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border: 1px solid var(--line); border-radius: 10px; }
.counter .val { font-family: var(--font-num); font-size: 38px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.counter .btns { display: flex; gap: 6px; }
.counter .btns button { width: 44px; height: 40px; padding: 0; font-size: 22px; line-height: 1; }
.vs-par { font-size: 13px; font-weight: 600; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; flex: 1; background: transparent; }
.seg button[aria-pressed="true"] { background: var(--fairway); color: var(--fairway-ink); }

/* Tiros */
.shots { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.shots li { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.shots li:last-child { border-bottom: 0; }
.shot-n { font-family: var(--font-num); font-weight: 700; color: var(--muted); }

/* Tarjeta de score */
.card-scroll { overflow-x: auto; }
table.score { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; min-width: 320px; }
table.score th, table.score td { border: 1px solid var(--line); padding: 5px 4px; text-align: center; font-family: var(--font-num); font-size: 17px; }
table.score th { font-size: 12px; color: var(--muted); font-family: var(--font-body); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
table.score td.cur { outline: 2px solid var(--flag); outline-offset: -2px; }
.birdie { color: var(--good); font-weight: 700; }
.bogey { color: var(--bad); }

/* Estadísticas */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--font-num); font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--sand); color: var(--ink); }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }

.round-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.round-list li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.round-list li:last-child { border-bottom: 0; }
.round-score { font-family: var(--font-num); font-size: 30px; font-weight: 700; line-height: 1; text-align: right; grid-row: span 2; align-self: center; }

.pars { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
.pars label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); text-align: center; }
.pars select { padding: 6px 4px; text-align: center; }

.example { font-size: 12px; }
.notice { font-size: 14px; background: var(--sand); border-radius: 10px; padding: 10px 12px; }

/* Pestañas */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center;
}
nav.tabs .inner { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 560px; }
nav.tabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; color: var(--muted); }
nav.tabs button[aria-current="page"] { background: color-mix(in srgb, var(--fairway) 14%, transparent); color: var(--fairway); }
@media (prefers-reduced-motion: no-preference) {
  .dist .cell.main .val { transition: color .2s; }
}
</style>

<div class="wrap" id="app" aria-live="polite"></div>

<nav class="tabs" aria-label="Secciones">
  <div class="inner">
    <button id="tab-ronda" data-tab="ronda">Ronda</button>
    <button id="tab-historial" data-tab="historial">Historial</button>
    <button id="tab-perfil" data-tab="perfil">Perfil</button>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- Utilidades ---------- */
  const M_TO_YD = 1.09361;
  const CLUBS = ["Driver", "Madera 3", "Híbrido", "Hierro 4", "Hierro 5", "Hierro 6", "Hierro 7", "Hierro 8", "Hierro 9", "PW", "SW", "Putter"];
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);

  // Distancia entre dos puntos GPS (fórmula de Haversine), en metros
  function distanceM(a, b) {
    const R = 6371000, rad = Math.PI / 180;
    const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const yd = (m) => Math.round(m * M_TO_YD);
  const fmtDate = (iso) => new Date(iso).toLocaleDateString("es-AR", { day: "numeric", month: "short", year: "numeric" });
  const signed = (n) => (n > 0 ? "+" + n : n === 0 ? "E" : String(n));

  /* ---------- Datos (guardados en este navegador) ---------- */
  const KEY = "libreta-golf-v1";
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* sin almacenamiento disponible */ }
    return null;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state.data)); } catch (e) { /* ignorar */ }
  }
  function exampleData() {
    // Datos de ejemplo para que la app no arranque vacía. Se pueden borrar desde Perfil.
    const pars = [4, 4, 3, 5, 4, 4, 3, 4, 5, 4, 3, 4, 5, 4, 4, 3, 4, 5];
    const course = { id: "ej-cancha", name: "Cancha de ejemplo", pars, rating: 71.2, slope: 125, greens: {}, example: true };
    const mk = (daysAgo, scores, putts) => ({
      id: uid(), courseId: course.id, date: new Date(Date.now() - daysAgo * 864e5).toISOString(), done: true, example: true,
      holes: pars.map((p, i) => ({ strokes: scores[i], putts: putts[i], penalties: 0, fairway: p > 3 ? (i % 3 !== 0) : null, shots: [] })),
    });
    return {
      profile: { name: "", handicap: 18, level: "intermedio" },
      courses: [course],
      rounds: [
        mk(21, [5, 5, 4, 6, 5, 4, 3, 5, 6, 5, 4, 5, 6, 5, 4, 4, 5, 6], [2, 2, 2, 2, 2, 1, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2]),
        mk(10, [5, 4, 3, 6, 5, 5, 4, 5, 5, 4, 4, 5, 6, 5, 5, 3, 5, 6], [2, 2, 1, 2, 2, 2, 2, 2, 2, 1, 2, 2, 2, 2, 2, 1, 2, 2]),
        mk(3, [4, 5, 3, 5, 5, 4, 4, 4, 6, 5, 3, 5, 5, 4, 5, 4, 4, 6], [2, 2, 2, 1, 2, 2, 2, 1, 2, 2, 1, 2, 2, 2, 2, 2, 2, 2]),
      ],
      activeRoundId: null,
    };
  }

  const state = {
    data: load() || exampleData(),
    tab: "ronda",
    hole: 0,
    pos: null,            // {lat, lng, acc}
    gps: "idle",          // idle | on | denied | unavailable
    club: "Driver",
    setGreenMode: false,
    showNewCourse: false,
  };

  const activeRound = () => state.data.rounds.find((r) => r.id === state.data.activeRoundId) || null;
  const courseOf = (round) => state.data.courses.find((c) => c.id === round.courseId);

  /* ---------- GPS ---------- */
  let watchId = null;
  function startGps() {
    if (watchId !== null) return;
    if (!("geolocation" in navigator)) { state.gps = "unavailable"; return; }
    try {
      watchId = navigator.geolocation.watchPosition(
        (p) => {
          state.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy };
          state.gps = "on";
          updateLive();
        },
        (err) => {
          state.gps = err && err.code === 1 ? "denied" : "unavailable";
          updateLive();
        },
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 }
      );
    } catch (e) { state.gps = "unavailable"; }
  }

  /* ---------- Estadísticas ---------- */
  function roundStats(round) {
    const course = courseOf(round);
    const pars = course.pars;
    let strokes = 0, putts = 0, par = 0, played = 0, fw = 0, fwTotal = 0, gir = 0;
    round.holes.forEach((h, i) => {
      if (!h.strokes) return;
      played++; strokes += h.strokes; putts += h.putts; par += pars[i];
      if (h.fairway !== null && h.fairway !== undefined) { fwTotal++; if (h.fairway) fw++; }
      if (h.strokes - h.putts <= pars[i] - 2) gir++;
    });
    return { strokes, putts, par, played, toPar: strokes - par, fw, fwTotal, gir };
  }
  // Diferencial WHS (sin ajuste por condiciones del día)
  function differential(round) {
    const c = courseOf(round);
    const s = roundStats(round);
    if (!c || !c.rating || !c.slope || s.played !== 18) return null;
    // Score ajustado: tope de doble bogey neto aproximado (par + 2 + golpes de handicap por hoyo ≈ par + 3)
    const hcp = state.data.profile.handicap || 0;
    const extra = Math.round(hcp / 18);
    const adj = round.holes.reduce((t, h, i) => t + Math.min(h.strokes, c.pars[i] + 2 + extra), 0);
    return (113 / c.slope) * (adj - c.rating);
  }
  // Índice estimado según la tabla de WHS para menos de 20 rondas
  function handicapIndex() {
    const diffs = state.data.rounds.filter((r) => r.done).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20)
      .map(differential).filter((d) => d !== null).sort((a, b) => a - b);
    const n = diffs.length;
    if (n < 3) return { value: null, n };
    const table = { 3: [1, -2], 4: [1, -1], 5: [1, 0], 6: [2, -1], 7: [2, 0], 8: [2, 0], 9: [3, 0], 10: [3, 0], 11: [3, 0], 12: [4, 0], 13: [4, 0], 14: [4, 0], 15: [5, 0], 16: [5, 0], 17: [6, 0], 18: [6, 0], 19: [7, 0], 20: [8, 0] };
    const [take, adj] = table[n];
    const avg = diffs.slice(0, take).reduce((a, b) => a + b, 0) / take;
    return { value: Math.round((avg + adj) * 10) / 10, n };
  }

  /* ---------- Render ---------- */
  let map = null, mapLayers = null, tilesFailed = false;

  function render() {
    document.querySelectorAll("nav.tabs button").forEach((b) => {
      if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    if (map) { map.remove(); map = null; }
    const app = $("#app");
    if (state.tab === "ronda") app.innerHTML = activeRound() ? viewHole() : viewStart();
    else if (state.tab === "historial") app.innerHTML = viewHistory();
    else app.innerHTML = viewProfile();
    if (state.tab === "ronda" && activeRound()) { startGps(); setupMap(); updateLive(); }
  }

  function viewStart() {
    const courses = state.data.courses;
    return `
      <header class="row between"><h1>Nueva ronda</h1><span class="label">Libreta de golf</span></header>
      <section class="panel">
        <label class="field" for="course-select"><span class="label">Cancha</span>
          <select id="course-select">${courses.map((c) => `<option value="${c.id}">${esc(c.name)} · ${c.pars.length} hoyos · par ${c.pars.reduce((a, b) => a + b, 0)}</option>`).join("")}</select>
        </label>
        <div class="row">
          <button class="primary" id="btn-start" ${courses.length ? "" : "disabled"}>Empezar ronda</button>
          <button id="btn-new-course">${state.showNewCourse ? "Cancelar" : "Agregar cancha"}</button>
        </div>
      </section>
      ${state.showNewCourse ? viewNewCourse() : ""}
      <section class="panel">
        <h2>Cómo se usa</h2>
        <p class="muted" style="margin:0">En cada hoyo, marcá el green tocando el mapa una vez; la app lo recuerda para la próxima. Después, tocá <b>Registrar tiro</b> parado donde está tu pelota antes de pegarle: así calcula las yardas de cada golpe.</p>
      </section>`;
  }

  function viewNewCourse() {
    const n = state.newCourseHoles || 18;
    const pars = state.newCoursePars && state.newCoursePars.length === n ? state.newCoursePars : Array(n).fill(4);
    state.newCoursePars = pars;
    return `
      <section class="panel">
        <h2>Nueva cancha</h2>
        <div class="row">
          <label class="field" for="nc-name"><span class="label">Nombre</span><input id="nc-name" placeholder="Ej.: Golf Club del Norte" value="${esc(state.newCourseName || "")}"></label>
          <label class="field" for="nc-holes" style="flex:0 1 110px"><span class="label">Hoyos</span>
            <select id="nc-holes"><option value="18" ${n === 18 ? "selected" : ""}>18</option><option value="9" ${n === 9 ? "selected" : ""}>9</option></select></label>
        </div>
        <div class="row">
          <label class="field" for="nc-rating"><span class="label">Course rating (opcional)</span><input id="nc-rating" inputmode="decimal" placeholder="Ej.: 71,2"></label>
          <label class="field" for="nc-slope"><span class="label">Slope (opcional)</span><input id="nc-slope" inputmode="numeric" placeholder="Ej.: 125"></label>
        </div>
        <span class="label">Par de cada hoyo</span>
        <div class="pars">${pars.map((p, i) => `<label for="np-${i}">Hoyo ${i + 1}<select id="np-${i}" data-par="${i}">${[3, 4, 5, 6].map((v) => `<option ${v === p ? "selected" : ""}>${v}</option>`).join("")}</select></label>`).join("")}</div>
        <p class="muted example" style="margin:0">El course rating y el slope figuran en la tarjeta del club. Sirven para calcular tu handicap estimado.</p>
        <button class="primary" id="btn-save-course">Guardar cancha</button>
      </section>`;
  }

  function viewHole() {
    const r = activeRound(), c = courseOf(r), i = state.hole, h = r.holes[i], par = c.pars[i];
    const s = roundStats(r);
    const isPar3 = par === 3;
    return `
      <div class="hole-head">
        <button id="prev" aria-label="Hoyo anterior" ${i === 0 ? "disabled" : ""}>‹</button>
        <div class="hole-mid">
          <div class="lbl">${esc(c.name)}</div>
          <div class="big">Hoyo ${i + 1}</div>
          <div class="lbl">Par ${par} · Total ${s.played ? signed(s.toPar) : "E"}</div>
        </div>
        <button id="next" aria-label="Hoyo siguiente" ${i === c.pars.length - 1 ? "disabled" : ""}>›</button>
      </div>

      <section class="panel">
        <div class="row between"><span class="label">Distancia al green (yardas)</span><span class="gps-status" id="gps-status"></span></div>
        <div class="dist">
          <div class="cell"><span class="val" id="d-front">–</span><span class="label">Frente</span></div>
          <div class="cell main"><span class="val" id="d-center">–</span><span class="label">Centro</span></div>
          <div class="cell"><span class="val" id="d-back">–</span><span class="label">Fondo</span></div>
        </div>
        <div id="map" role="application" aria-label="Mapa del hoyo"></div>
        <p class="map-note muted" id="map-note" style="margin:0"></p>
        <div class="row">
          <button id="btn-green" class="${state.setGreenMode ? "flag" : ""}">${state.setGreenMode ? "Tocá el centro del green en el mapa" : (c.greens[i] ? "Mover el green" : "Marcar el green")}</button>
          <button id="btn-green-here">Estoy en el green</button>
        </div>
      </section>

      <section class="panel">
        <div class="counters">
          ${counter("Golpes", "strokes", h.strokes)}
          ${counter("Putts", "putts", h.putts)}
          ${counter("Penales", "penalties", h.penalties)}
        </div>
        <div class="row between">
          <span class="vs-par" id="vs-par">${h.strokes ? scoreName(h.strokes - par) : "Sin golpes todavía"}</span>
          ${isPar3 ? "" : `<div class="row"><span class="label">Fairway</span>
            <div class="seg" role="group" aria-label="Fairway acertado">
              <button data-fw="1" aria-pressed="${h.fairway === true}">Sí</button>
              <button data-fw="0" aria-pressed="${h.fairway === false}">No</button>
            </div></div>`}
        </div>
      </section>

      <section class="panel">
        <div class="row between"><h2>Tiros del hoyo</h2><span class="label">${h.shots.length} registrados</span></div>
        <div class="row">
          <label class="field" for="club"><span class="label">Palo</span>
            <select id="club">${CLUBS.map((cl) => `<option ${cl === state.club ? "selected" : ""}>${cl}</option>`).join("")}</select></label>
          <button class="primary" id="btn-shot" style="align-self:flex-end">Registrar tiro</button>
        </div>
        ${h.shots.length ? `<ol class="shots">${h.shots.map((sh, k) => {
          const next = h.shots[k + 1];
          const len = next ? `${yd(distanceM(sh, next))} yd` : (c.greens[i] ? `faltaban ${yd(distanceM(sh, c.greens[i]))} yd` : "");
          return `<li><span class="shot-n">${k + 1}</span><span>${esc(sh.club)}</span><span class="num">${len}</span></li>`;
        }).join("")}</ol>` : `<p class="muted" style="margin:0">Parate donde está tu pelota, elegí el palo y tocá <b>Registrar tiro</b> antes de pegarle. La distancia de cada tiro se calcula con la posición del siguiente.</p>`}
      </section>

      <section class="panel">
        <h2>Tarjeta</h2>
        ${scorecard(r, c)}
        <button class="flag" id="btn-finish">Terminar ronda</button>
        <button class="ghost" id="btn-discard">Descartar ronda</button>
        <div id="discard-confirm" hidden class="notice">
          ¿Seguro? Se borra esta ronda y no se puede recuperar.
          <div class="row" style="margin-top:8px"><button id="discard-yes">Sí, descartar</button><button id="discard-no">Cancelar</button></div>
        </div>
      </section>`;
  }

  function counter(label, key, val) {
    return `<div class="counter"><span class="label">${label}</span><span class="val">${val}</span>
      <div class="btns"><button data-dec="${key}" aria-label="Restar ${label.toLowerCase()}">−</button><button data-inc="${key}" aria-label="Sumar ${label.toLowerCase()}">+</button></div></div>`;
  }
  function scoreName(diff) {
    const names = { "-3": "Albatros", "-2": "Eagle", "-1": "Birdie", "0": "Par", "1": "Bogey", "2": "Doble bogey", "3": "Triple bogey" };
    const n = names[String(diff)] || (diff > 0 ? `+${diff}` : String(diff));
    const cls = diff < 0 ? "good" : diff > 0 ? "bad" : "";
    return `<span class="pill ${cls}">${n}</span>`;
  }

  function scorecard(r, c) {
    const halves = c.pars.length === 18 ? [[0, 9], [9, 18]] : [[0, c.pars.length]];
    return `<div class="card-scroll">${halves.map(([a, b]) => {
      const idx = Array.from({ length: b - a }, (_, k) => a + k);
      const sum = (f) => idx.reduce((t, k) => t + f(k), 0);
      return `<table class="score" style="margin-bottom:8px">
        <tr><th>Hoyo</th>${idx.map((k) => `<th>${k + 1}</th>`).join("")}<th>${a === 0 ? (b === 9 ? "Ida" : "Tot") : "Vta"}</th></tr>
        <tr><th>Par</th>${idx.map((k) => `<td>${c.pars[k]}</td>`).join("")}<td>${sum((k) => c.pars[k])}</td></tr>
        <tr><th>Golpes</th>${idx.map((k) => {
          const st = r.holes[k].strokes, d = st - c.pars[k];
          const cls = [k === state.hole && state.tab === "ronda" && r.id === state.data.activeRoundId ? "cur" : "", st ? (d < 0 ? "birdie" : d > 0 ? "bogey" : "") : ""].join(" ");
          return `<td class="${cls}">${st || ""}</td>`;
        }).join("")}<td>${sum((k) => r.holes[k].strokes) || ""}</td></tr>
        <tr><th>Putts</th>${idx.map((k) => `<td>${r.holes[k].strokes ? r.holes[k].putts : ""}</td>`).join("")}<td>${sum((k) => r.holes[k].putts) || ""}</td></tr>
      </table>`;
    }).join("")}</div>`;
  }

  function viewHistory() {
    const done = state.data.rounds.filter((r) => r.done).sort((a, b) => b.date.localeCompare(a.date));
    const p = state.data.profile;
    if (!done.length) return `<header><h1>Historial</h1></header><section class="panel"><p class="muted" style="margin:0">Todavía no terminaste ninguna ronda. Cuando termines la primera, vas a ver acá tus estadísticas y cómo jugaste según tu handicap.</p></section>`;
    const full = done.map((r) => ({ r, s: roundStats(r) })).filter((x) => x.s.played === courseOf(x.r).pars.length);
    const avg = (f) => full.length ? full.reduce((t, x) => t + f(x), 0) / full.length : 0;
    const avgScore = avg((x) => x.s.strokes), avgPutts = avg((x) => x.s.putts);
    const fwPct = (() => { const t = full.reduce((a, x) => a + x.s.fwTotal, 0); return t ? Math.round(100 * full.reduce((a, x) => a + x.s.fw, 0) / t) : null; })();
    const girPct = (() => { const t = full.reduce((a, x) => a + x.s.played, 0); return t ? Math.round(100 * full.reduce((a, x) => a + x.s.gir, 0) / t) : null; })();
    const hi = handicapIndex();
    const last = full[0];
    const expected = last ? last.s.par + (p.handicap || 0) : null;
    const anyExample = done.some((r) => r.example);
    return `
      <header class="row between"><h1>Historial</h1>${anyExample ? `<span class="pill">Incluye ejemplos</span>` : ""}</header>
      ${last ? `<section class="panel">
        <span class="label">Última ronda · ${fmtDate(last.r.date)}</span>
        <div class="row between"><h2>${esc(courseOf(last.r).name)}</h2><span class="num" style="font-size:34px;font-weight:700">${last.s.strokes}</span></div>
        <p style="margin:0">Con handicap ${p.handicap}, lo esperado era unos <b class="num">${expected}</b> golpes.
          ${last.s.strokes <= expected ? `<span class="pill good">${expected - last.s.strokes} golpes mejor</span>` : `<span class="pill bad">${last.s.strokes - expected} golpes arriba</span>`}</p>
        <p class="muted" style="margin:0">${insight(last.s, p)}</p>
      </section>` : ""}
      <section class="panel">
        <h2>Promedios</h2>
        <div class="stats">
          <div class="stat"><span class="label">Score</span><span class="v">${full.length ? avgScore.toFixed(1) : "–"}</span></div>
          <div class="stat"><span class="label">Putts</span><span class="v">${full.length ? avgPutts.toFixed(1) : "–"}</span></div>
          <div class="stat"><span class="label">Fairways</span><span class="v">${fwPct !== null ? fwPct + "%" : "–"}</span></div>
          <div class="stat"><span class="label">Greens en regulación</span><span class="v">${girPct !== null ? girPct + "%" : "–"}</span></div>
          <div class="stat"><span class="label">Handicap estimado</span><span class="v">${hi.value !== null ? hi.value.toFixed(1) : "–"}</span>
            <span class="muted example">${hi.value !== null ? `con ${hi.n} rondas` : `faltan ${Math.max(0, 3 - hi.n)} rondas con rating y slope`}</span></div>
        </div>
        <p class="muted example" style="margin:0">El handicap estimado usa la fórmula del sistema mundial (WHS). No es oficial: el oficial lo lleva la asociación de golf de tu país.</p>
      </section>
      <section class="panel">
        <h2>Rondas</h2>
        <ul class="round-list">${done.map((r) => { const s = roundStats(r); return `<li>
          <span><b>${esc(courseOf(r).name)}</b>${r.example ? ` <span class="pill">Ejemplo</span>` : ""}</span>
          <span class="round-score">${s.strokes}</span>
          <span class="muted example">${fmtDate(r.date)} · ${signed(s.toPar)} · ${s.putts} putts${s.played < courseOf(r).pars.length ? ` · ${s.played} de ${courseOf(r).pars.length} hoyos` : ""}</span></li>`; }).join("")}</ul>
      </section>`;
  }

  // Un consejo simple según el nivel del jugador
  function insight(s, p) {
    const puttsPerHole = s.putts / s.played;
    const target = p.level === "principiante" ? 2.1 : p.level === "avanzado" ? 1.75 : 1.9;
    if (puttsPerHole > target + 0.1) return `Tus putts (${s.putts}) están por encima de lo habitual para tu nivel. Practicar putts de 1 a 2 metros es lo que más golpes te puede ahorrar.`;
    if (s.fwTotal && s.fw / s.fwTotal < 0.4) return `Acertaste ${s.fw} de ${s.fwTotal} fairways. Probá con un palo más corto desde el tee en los hoyos angostos.`;
    if (s.gir / s.played < 0.2) return `Llegaste a ${s.gir} greens en regulación. Trabajar los tiros de aproximación te va a dar más chances de birdie.`;
    return "Ronda pareja en todas las áreas del juego. Seguí registrando tiros para ver tu distancia real con cada palo.";
  }

  function viewProfile() {
    const p = state.data.profile;
    const hasExamples = state.data.rounds.some((r) => r.example) || state.data.courses.some((c) => c.example);
    return `
      <header><h1>Perfil</h1></header>
      <section class="panel">
        <label class="field" for="pf-name"><span class="label">Nombre</span><input id="pf-name" value="${esc(p.name)}" placeholder="Tu nombre"></label>
        <div class="row">
          <label class="field" for="pf-hcp"><span class="label">Handicap</span><input id="pf-hcp" inputmode="decimal" value="${p.handicap}"></label>
          <label class="field" for="pf-level"><span class="label">Nivel</span>
            <select id="pf-level">${["principiante", "intermedio", "avanzado"].map((l) => `<option value="${l}" ${p.level === l ? "selected" : ""}>${l[0].toUpperCase() + l.slice(1)}</option>`).join("")}</select></label>
        </div>
        <button class="primary" id="btn-save-profile">Guardar perfil</button>
        <span class="muted example" id="pf-saved" hidden>Perfil guardado.</span>
      </section>
      ${hasExamples ? `<section class="panel">
        <h2>Datos de ejemplo</h2>
        <p class="muted" style="margin:0">La app trae una cancha y 3 rondas de ejemplo para que veas cómo funciona. Borralos cuando cargues tus propias rondas.</p>
        <button id="btn-clear-examples">Borrar datos de ejemplo</button>
      </section>` : ""}
      <section class="panel">
        <h2>Tus datos</h2>
        <p class="muted" style="margin:0">Todo se guarda solo en este celular, en este navegador. Si borrás los datos del navegador, se pierde el historial.</p>
      </section>`;
  }

  /* ---------- Mapa ---------- */
  function setupMap() {
    const el = $("#map");
    const note = $("#map-note");
    if (!el) return;
    if (typeof L === "undefined") {
      el.hidden = true;
      note.textContent = "El mapa no se pudo cargar acá. Abrí la versión publicada en internet para ver el mapa satelital.";
      return;
    }
    const r = activeRound(), c = courseOf(r), g = c.greens[state.hole];
    const center = g || state.pos || { lat: -34.6037, lng: -58.3816 };
    map = L.map(el, { zoomControl: true, attributionControl: true }).setView([center.lat, center.lng], g || state.pos ? 17 : 12);
    const tiles = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 20, maxNativeZoom: 19, attribution: "Imágenes © Esri",
    }).addTo(map);
    let errors = 0;
    tiles.on("tileerror", () => {
      errors++;
      if (errors > 3 && !tilesFailed) {
        tilesFailed = true;
        note.textContent = "Las imágenes satelitales no cargan en esta vista. En la versión publicada en internet sí se ven.";
      }
    });
    mapLayers = L.layerGroup().addTo(map);
    map.on("click", (e) => {
      if (!state.setGreenMode) return;
      c.greens[state.hole] = { lat: e.latlng.lat, lng: e.latlng.lng };
      state.setGreenMode = false;
      save();
      render();
    });
    drawMap();
    if (!tilesFailed) note.textContent = g ? "" : "Tocá «Marcar el green» y después el centro del green en el mapa.";
  }

  function drawMap() {
    if (!map || !mapLayers) return;
    mapLayers.clearLayers();
    const r = activeRound(), c = courseOf(r), i = state.hole, h = r.holes[i], g = c.greens[i];
    const pts = h.shots.map((s) => [s.lat, s.lng]);
    if (pts.length) L.polyline(pts.concat(g ? [[g.lat, g.lng]] : []), { color: "#E2B529", weight: 3, dashArray: "6 6" }).addTo(mapLayers);
    h.shots.forEach((s, k) => L.circleMarker([s.lat, s.lng], { radius: 6, color: "#fff", weight: 2, fillColor: "#1F6B3A", fillOpacity: 1 }).bindTooltip(`Tiro ${k + 1}`).addTo(mapLayers));
    if (g) {
      L.circle([g.lat, g.lng], { radius: 14, color: "#E2B529", weight: 2, fillOpacity: 0.15 }).addTo(mapLayers);
      L.circleMarker([g.lat, g.lng], { radius: 5, color: "#E2B529", fillColor: "#E2B529", fillOpacity: 1 }).bindTooltip("Green").addTo(mapLayers);
    }
    if (state.pos) L.circleMarker([state.pos.lat, state.pos.lng], { radius: 8, color: "#fff", weight: 3, fillColor: "#2F7DE1", fillOpacity: 1 }).bindTooltip("Vos").addTo(mapLayers);
  }

  /* ---------- Actualización en vivo (GPS) ---------- */
  function updateLive() {
    const st = $("#gps-status");
    if (!st) return;
    const msgs = {
      idle: `<span class="dot"></span>Buscando GPS…`,
      on: `<span class="dot on"></span>GPS ±${state.pos ? Math.round(state.pos.acc) : "?"} m`,
      denied: `<span class="dot off"></span>Permiso de ubicación denegado`,
      unavailable: `<span class="dot off"></span>GPS no disponible acá`,
    };
    st.innerHTML = msgs[state.gps];
    const r = activeRound(), c = courseOf(r), g = c.greens[state.hole];
    const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
    if (g && state.pos) {
      const d = distanceM(state.pos, g);
      // Sin el contorno del green, frente y fondo se estiman a ±12 m del centro (un green típico mide unos 25 m de largo)
      set("#d-center", yd(d)); set("#d-front", yd(Math.max(0, d - 12))); set("#d-back", yd(d + 12));
    } else {
      set("#d-center", "–"); set("#d-front", "–"); set("#d-back", "–");
    }
    const note = $("#map-note");
    if (note && (state.gps === "denied" || state.gps === "unavailable") && !tilesFailed) {
      note.textContent = state.gps === "denied"
        ? "Para ver distancias, permití el acceso a la ubicación en la configuración del navegador."
        : "El GPS no funciona en esta vista. Abrí la versión publicada en internet desde el navegador del celular.";
    }
    const btnShot = $("#btn-shot"), btnHere = $("#btn-green-here");
    if (btnShot) btnShot.disabled = !state.pos;
    if (btnHere) btnHere.disabled = !state.pos;
    drawMap();
  }

  /* ---------- Eventos ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const r = activeRound();
    if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
    if (t.dataset.inc || t.dataset.dec) {
      const key = t.dataset.inc || t.dataset.dec, h = r.holes[state.hole];
      h[key] = Math.max(0, h[key] + (t.dataset.inc ? 1 : -1));
      if (key === "putts" && h.putts > h.strokes) h.strokes = h.putts;
      if (key === "strokes" && h.putts > h.strokes) h.putts = h.strokes;
      save(); render(); return;
    }
    if (t.dataset.fw !== undefined) {
      const h = r.holes[state.hole], v = t.dataset.fw === "1";
      h.fairway = h.fairway === v ? null : v; save(); render(); return;
    }
    switch (t.id) {
      case "btn-new-course": state.showNewCourse = !state.showNewCourse; render(); break;
      case "btn-save-course": {
        const name = $("#nc-name").value.trim() || "Cancha sin nombre";
        const rating = parseFloat(($("#nc-rating").value || "").replace(",", ".")) || null;
        const slope = parseInt($("#nc-slope").value, 10) || null;
        const course = { id: uid(), name, pars: state.newCoursePars.slice(), rating, slope, greens: {} };
        state.data.courses.push(course);
        state.showNewCourse = false; state.newCourseName = ""; state.newCoursePars = null;
        save(); render();
        const sel = $("#course-select"); if (sel) sel.value = course.id;
        break;
      }
      case "btn-start": {
        const c = state.data.courses.find((x) => x.id === $("#course-select").value);
        const round = { id: uid(), courseId: c.id, date: new Date().toISOString(), done: false,
          holes: c.pars.map(() => ({ strokes: 0, putts: 0, penalties: 0, fairway: null, shots: [] })) };
        state.data.rounds.push(round); state.data.activeRoundId = round.id; state.hole = 0;
        save(); render(); break;
      }
      case "prev": state.hole = Math.max(0, state.hole - 1); state.setGreenMode = false; render(); break;
      case "next": state.hole = Math.min(courseOf(r).pars.length - 1, state.hole + 1); state.setGreenMode = false; render(); break;
      case "btn-green": state.setGreenMode = !state.setGreenMode; render(); break;
      case "btn-green-here":
        if (state.pos) { courseOf(r).greens[state.hole] = { lat: state.pos.lat, lng: state.pos.lng }; save(); render(); }
        break;
      case "btn-shot": {
        if (!state.pos) break;
        const h = r.holes[state.hole];
        h.shots.push({ lat: state.pos.lat, lng: state.pos.lng, club: state.club, t: Date.now() });
        if (state.club !== "Putter") h.strokes = Math.max(h.strokes, h.shots.length);
        save(); render(); break;
      }
      case "btn-finish": r.done = true; state.data.activeRoundId = null; save(); state.tab = "historial"; render(); break;
      case "btn-discard": $("#discard-confirm").hidden = false; break;
      case "discard-no": $("#discard-confirm").hidden = true; break;
      case "discard-yes":
        state.data.rounds = state.data.rounds.filter((x) => x.id !== r.id); state.data.activeRoundId = null; save(); render(); break;
      case "btn-save-profile": {
        const p = state.data.profile;
        p.name = $("#pf-name").value.trim();
        const hc = parseFloat(($("#pf-hcp").value || "").replace(",", "."));
        p.handicap = isNaN(hc) ? p.handicap : hc;
        p.level = $("#pf-level").value;
        save(); $("#pf-saved").hidden = false; break;
      }
      case "btn-clear-examples":
        state.data.courses = state.data.courses.filter((x) => !x.example);
        state.data.rounds = state.data.rounds.filter((x) => !x.example && state.data.courses.some((c) => c.id === x.courseId));
        if (!activeRound()) state.data.activeRoundId = null;
        save(); render(); break;
    }
  });
  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "club") state.club = t.value;
    if (t.id === "nc-holes") { state.newCourseHoles = parseInt(t.value, 10); state.newCourseName = $("#nc-name").value; render(); }
    if (t.dataset.par !== undefined) state.newCoursePars[+t.dataset.par] = parseInt(t.value, 10);
  });

  // Si había una ronda en curso, volver al hoyo donde quedó
  const ar = activeRound();
  if (ar) { const k = ar.holes.findIndex((h) => !h.strokes); state.hole = k === -1 ? ar.holes.length - 1 : k; }
  render();
})();
</script>

</body>
</html>
